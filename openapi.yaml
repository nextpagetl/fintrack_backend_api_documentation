                              $ref: "#/components/schemas/BankAccount"
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
              example:
                code: 200
                success: true
                message: List Data
                data:
                  items:
                    - id: 48
                      company_id: 1
                      bank_name: Test Bank Limited
                      account_name: Test Ltd
                      account_number: "1234567890"
                      branch: Motijheel
                      status: Approved
                      created_at: "2026-11-09T10:20:00.000000Z"
                    - id: 2
                      company_id: 1
                      bank_name: Dutch-Bangla Bank Limited (DBBL)
                      account_name: null
                      account_number: null
                      branch: null
                      status: Approved
                      created_at: "2025-01-18T10:02:06.000000Z"
                  pagination:
                    current_page: 1
                    per_page: 10
                    total: 2
                    last_page: 1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Bank Accounts
      summary: Create bank account
      description: |
        Creates a bank account for the logged-in user's company. The `bank_name` rules are the same
        as the web form (`admin/account-setup-bank-account-create`), read from the bank form settings,
        plus a unique name check. `account_name`, `account_number` and `branch` are not in the web form
        but are saved by the same code, so the API accepts them.

        - `status` is always saved as `Approved`, even if another value is sent.
        - `bank_name` must be unique within the logged-in user's company (not case-sensitive).
          Soft-deleted bank accounts and other companies' bank accounts are not counted.

        Required permission: `module:accounts-setup.menu:bank.permission:create`
      operationId: createBankAccount

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bank_name
              properties:
                bank_name:
                  $ref: "#/components/schemas/BankName"
                account_name:
                  type: [string, "null"]
                  maxLength: 100
                  example: Test Ltd
                account_number:
                  type: [string, "null"]
                  maxLength: 255
                  example: "1234567890"
                branch:
                  type: [string, "null"]
                  maxLength: 100
                  example: Motijheel

      responses:
        "201":
          description: Bank account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BankAccount"
              example:
                code: 201
                success: true
                message: Bank account created successfully.
                data:
                  id: 48
                  company_id: 1
                  bank_name: Test Bank Limited
                  account_name: Test Ltd
                  account_number: "1234567890"
                  branch: Motijheel
                  status: Approved
                  created_at: "2026-11-09T10:20:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/BankAccountValidationError"

  /bank-accounts/{id}:
    put:
      tags:
        - Bank Accounts
      summary: Update bank account
      description: |
        Updates a bank account (API version of the web edit form
        `admin/account-setup-bank-account-edit/{id}`).

        **Only the fields in the body change.** A field that is not sent keeps its current value;
        sending `null` clears an optional field (`account_name`, `account_number`, `branch`).
        `bank_name` and `status` cannot be cleared. An empty body changes nothing and returns `200`.

        - `bank_name` must be unique within the logged-in user's company (not case-sensitive); the
          bank account's own name may be kept.
        - `status` is taken from the body when sent (`Approved`, `Inactive`, `Pending` or `Cancel`).

        Required permission: `module:accounts-setup.menu:bank.permission:edit`
      operationId: updateBankAccount

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BankAccountId"

      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_name:
                  $ref: "#/components/schemas/BankName"
                account_name:
                  type: [string, "null"]
                  maxLength: 100
                account_number:
                  type: [string, "null"]
                  maxLength: 255
                branch:
                  type: [string, "null"]
                  maxLength: 100
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
            examples:
              branchOnly:
                summary: Change only the branch (other fields keep their values)
                value:
                  branch: Gulshan
              clearAccountNumber:
                summary: Clear the account number
                value:
                  account_number: null
              statusOnly:
                summary: Change only the status
                value:
                  status: Pending

      responses:
        "200":
          description: Bank account updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BankAccount"
              example:
                code: 200
                success: true
                message: Bank account updated successfully.
                data:
                  id: 48
                  company_id: 1
                  bank_name: Test Bank Limited
                  account_name: Test Ltd
                  account_number: "1234567890"
                  branch: Gulshan
                  status: Approved
                  created_at: "2026-11-09T10:20:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BankAccountNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/BankAccountValidationError"

    delete:
      tags:
        - Bank Accounts
      summary: Delete bank account
      description: |
        Soft-deletes a bank account (`deleted_at` is set; the row stays in the database). A deleted
        bank account is no longer listed, returns `404` on every other endpoint, and its name can be
        used again.

        The bank account cannot be deleted (`409`) when a not-deleted row in any of these tables uses it
        (`bank_id`); `errors.used_in` lists which:
        `bookings`, `credit_notes`, `debit_notes`, `pos`, `purchases`, `purchases_payments`,
        `purchases_pending_cheques`, `sale_commission_payments`, `sale_payments`, `sale_pending_cheques`,
        `sale_return_wihout_refs`, `sales`, `sales_quatations`, `service_invoices`, `service_payments`,
        `service_pending_cheques`, `service_quatations`, `temporary_pending_checks`.
        The web delete button does **not** have this check.

        Required permission: `module:accounts-setup.menu:bank.permission:delete`
      operationId: deleteBankAccount

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BankAccountId"

      responses:
        "200":
          description: Bank account deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 48
              example:
                code: 200
                success: true
                message: Bank account deleted successfully.
                data:
                  id: 48

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BankAccountNotFound"

        "409":
          description: The bank account is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Bank account is in use and cannot be deleted.
                errors:
                  used_in: [sale_payments, sale_pending_cheques]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

