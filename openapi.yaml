      summary: Update customer
      description: |
        Updates a customer (API version of the web edit form `admin/sales-setup-customer-edit/{id}`).
        This is a **partial update**:

        - A field that is **not sent** keeps its current value.
        - A field sent **empty** (`""` or `null`) is saved as `null`. `name` and `customer_type`
          are required, so sending them empty returns `422`. An empty `branch_id` becomes the
          company's default branch (same as the web form).
