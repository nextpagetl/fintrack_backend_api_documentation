openapi: 3.1.0

info:
  title: FinTrack360 Backend API
  version: 1.3.0
  description: |
    FinTrack360 Backend REST API Documentation.

    This specification documents the routes defined in `routes/api.php`.

    ## Authentication
    The API uses **Laravel Sanctum SPA (session cookie) authentication**, not bearer tokens.

    1. Call `GET /csrf-token` to start a session and get a CSRF token.
    2. Call `POST /login` with the `X-CSRF-TOKEN` header. On success the session cookie
       is authenticated and a new `csrf_token` is returned.
    3. Send the session cookie and the latest `X-CSRF-TOKEN` with every following
       `POST`, `PUT`, `PATCH` and `DELETE` request (for example `POST /logout`, `PUT /roles/{id}`).

    ## Response format
    Every response written by the API controllers uses the same envelope:

    ```json
    // success
    { "code": 200, "success": true,  "message": "List Data", "data": { } }
    // error
    { "code": 404, "success": false, "message": "Not Found", "errors": "Data Not Found" }
    ```

    `code` in the body is the same as the HTTP status code. `data` / `errors` change per
    endpoint and are described below.

    A few errors come from Laravel or Spatie directly and do **not** use the envelope; their
    body is only `{ "message": "..." }`:

    | Status | When | `message` |
    |---|---|---|
    | 401 | Not logged in / session expired | `Unauthenticated.` |
    | 403 | Missing Spatie permission | `User does not have the right permissions.` |
    | 419 | CSRF token missing or wrong | `CSRF token mismatch.` |
    | 429 | More than 5 login attempts per minute | `Too Many Attempts.` |

    When the server runs with `APP_DEBUG=true`, these framework errors also contain
    `exception`, `file`, `line` and `trace`. Production must run with `APP_DEBUG=false`.

    ## Permissions
    Role, branch and department endpoints also need a Spatie permission, named
    `module:<module>.menu:<menu>.permission:<action>`. The required permission is listed in
    each endpoint's description; without it the API returns `403`. The `superadmin` role
    passes every permission check.

    The client origin must be listed in `SANCTUM_STATEFUL_DOMAINS`, otherwise the
    session endpoints return `400`. Browser clients must send requests with credentials
    (`withCredentials: true` / `credentials: "include"`).

    ## Server requirement
    The installed packages (Symfony 8.1) need **PHP 8.4 or newer**. On an older PHP every
    request fails with a PHP parse error before reaching the API.

  contact:
    name: FinTrack360 API Support

servers:
  - url: https://backend-fintrack360.eduguard360.com/api
    description: Demo server

tags:
  - name: Authentication
    description: Session-based login and logout (Sanctum SPA)
  - name: User
    description: The currently logged-in user
  - name: Dashboard
    description: Company dashboard data
  - name: Roles
    description: User role management (Spatie permission)
  - name: Branches
    description: Branch management (Settings → Branch)
  - name: Departments
    description: Department management (Settings → Department)

paths:
  /csrf-token:
    get:
      tags:
        - Authentication
      summary: Get CSRF token
      description: |
        Starts a session and returns a CSRF token. Cross-origin SPA clients use this
        because they cannot read the `XSRF-TOKEN` cookie. Send the token in the
        `X-CSRF-TOKEN` header on `POST /login` and `POST /logout`.
      operationId: getCsrfToken

      security: []

      responses:
        "200":
          description: CSRF token returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 200
                success: true
                message: CSRF token
                data:
                  csrf_token: MNO0IvZ2M6xxELP5CM9lYysT0RJL9d4wIKglPXA8

        "400":
          $ref: "#/components/responses/SessionUnavailable"

  /login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticates the user with the web session guard. Only users with
        status `Approved` can log in. Limited to 5 requests per minute.
      operationId: login

      security: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: test.user@example.com
                password:
                  type: string
                  format: password
                  example: Test@1234
                remember:
                  type: boolean
                  description: Keep the user logged in ("remember me").
                  default: false
                  example: false

      responses:
        "200":
          description: Login successful. The session is now authenticated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 200
                success: true
                message: Login successful.
                data:
                  csrf_token: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "400":
          $ref: "#/components/responses/SessionUnavailable"

        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 401
                success: false
                message: Invalid email or password.
                errors: null

        "403":
          description: |
            The account exists but its status is not `Approved`. The session is reset, so use
            the new `csrf_token` in `errors` for the next request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - type: object
                    properties:
                      errors:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 403
                success: false
                message: Your account is not active.
                errors:
                  csrf_token: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The email must be a valid email address. "
                errors:
                  email:
                    - The email must be a valid email address.

        "429":
          $ref: "#/components/responses/TooManyRequests"

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logs the user out, invalidates the session and returns a new CSRF token.
      operationId: logout

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 200
                success: true
                message: Logged out successfully.
                data:
                  csrf_token: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

  /me:
    get:
      tags:
        - User
      summary: Get current user
      description: |
        Returns the details of the logged-in user, with the user's Spatie role and its
        permissions grouped as a tree (see `PermissionTree`). `role` is `null` when the
        user has no Spatie role assigned (for example users that only have an old
        `user_roles` role); such users get `403` on every permission-protected endpoint.
      operationId: getCurrentUser

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
              examples:
                withRole:
                  summary: User with a Spatie role
                  value:
                    code: 200
                    success: true
                    message: Detail data
                    data:
                      user:
                        id: 5
                        name: Test User
                        email: test.user@example.com
                        role_id: 3
                        role:
                          name: Test Manager
                          permissions:
                            module:
                              system-configuration:
                                menu:
                                  user-role:
                                    permission: [view, create, edit, change-status]
                                  user:
                                    permission: [view]
                        company_id: 1
                        status: Approved
                        email_verified_at: null
                withoutRole:
                  summary: User without a Spatie role
                  value:
                    code: 200
                    success: true
                    message: Detail data
                    data:
                      user:
                        id: 6
                        name: Test Sales User
                        email: test.sales@example.com
                        role_id: 8
                        role: null
                        company_id: 1
                        status: Approved
                        email_verified_at: null

        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard data
      description: |
        Returns all dashboard sections for the logged-in user's company in one response.

        - `business_summary`: day-by-day totals from the 1st of the current month to today.
        - `sales_and_collection`: month-by-month totals for the current year (Jan–Dec).
        - `top_products`: products by total sales amount, all time, highest first.
        - `top_customers`: customers by total sales subtotal, highest first.
        - `recent_transactions`: up to 15 purchase lines and 15 sale lines, newest date first.
        - `inventory_alert`: current stock per product, lowest quantity first.

        Amounts and quantities are returned as decimal strings (for example `"21754.0000"`).
        The first entry of each `business_summary` sales/purchases/collection array is the
        number `0`. Lists are not paginated.

        Super admin users (`role_id = 1`) get `403`.
      operationId: getDashboard

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
              example:
                code: 200
                success: true
                message: Detail data
                data:
                  business_summary:
                    dates: ["2026-11-01", "2026-11-01", "2026-11-02"]
                    totalSales: [0, "7426.7500", "11080.0000"]
                    totalPurchases: [0, "0.0000", "5890.0000"]
                    totalCollection: [0, "10599.2500", "8775.0000"]
                    totalAccountsReceivables: ["486391.5667", "-3240.0000", "2305.0000"]
                    totalAccountsPayables: ["1457499.2185", "0.0000", "5890.0000"]
                  sales_and_collection:
                    dates: [Jan, Feb, Mar]
                    sales: ["477766.5250", "428187.9000", "565990.3000"]
                    collections: ["448329.7500", "493622.0650", "639015.9750"]
                  top_products:
                    - quantity: "322399.850000"
                      total_price: "1184405.850000"
                      sales_id: 1
                      product_id: 10
                      branch_id: 1
                      store_id: 2
                      id: 1
                      company_id: 1
                      product:
                        id: 10
                        name: Test Product A
                  top_customers:
                    - subtotal: "656447.000000"
                      customer_id: 3
                      customerName: Test Customer Ltd
                  recent_transactions:
                    - date: "2026-11-02"
                      quantity: "5.000000"
                      total_price: "6500.000000"
                      product_id: 10
                      type: sale
                      product:
                        id: 10
                        name: Test Product A
                    - date: "2026-11-01"
                      quantity: "10.000000"
                      total_price: "9000.000000"
                      product_id: 11
                      type: purchase
                      product:
                        id: 11
                        name: Test Product B
                  inventory_alert:
                    - quantity: "2.000000"
                      product_id: 11
                      product:
                        id: 11
                        name: Test Product B
                        low_stock: "5.000000"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          description: The user is a super admin (`role_id = 1`). The dashboard is not available for this role yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 403
                success: false
                message: Development ongoing
                errors: null

  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: |
        Paginated list of roles (guard `web`) with each role's permissions as a tree.
        The `superadmin` role is never listed. The roles are in `data.list` and the
        pagination info in `data.meta`.

        Required permission: `module:system-configuration.menu:user-role.permission:view`
      operationId: listRoles

      security:
        - sessionCookie: []

      parameters:
        - name: search
          in: query
          description: Filter by role name (partial match).
          schema:
            type: string
          example: test
        - name: status
          in: query
          description: Filter by status. Any other value is ignored.
          schema:
            type: string
            enum: [Active, Inactive]
        - name: per_page
          in: query
          description: Items per page (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort_by
          in: query
          description: Any other value falls back to `id`.
          schema:
            type: string
            enum: [id, name, status, created_at]
            default: id
        - name: sort_dir
          in: query
          description: Any value other than `asc` sorts descending.
          schema:
            type: string
            enum: [asc, desc]
            default: desc

      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/Role"
                          meta:
                            $ref: "#/components/schemas/PaginationMeta"
              example:
                code: 200
                success: true
                message: List Data
                data:
                  list:
                    - id: 3
                      name: Test Manager
                      status: Active
                      created_at: "2026-11-05T10:15:00.000000Z"
                      permissions:
                        module:
                          system-configuration:
                            menu:
                              user-role:
                                permission: [view, create, edit, change-status]
                              user:
                                permission: [view]
                    - id: 4
                      name: Test Viewer
                      status: Inactive
                      created_at: "2026-11-05T10:20:00.000000Z"
                      permissions:
                        module: {}
                  meta:
                    current_page: 1
                    per_page: 10
                    total: 2
                    last_page: 1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Roles
      summary: Create role
      description: |
        Creates a role (guard `web`) and gives it the listed permissions.

        Required permission: `module:system-configuration.menu:user-role.permission:create`
      operationId: createRole

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"

      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
              example:
                code: 201
                success: true
                message: Role created successfully.
                data:
                  id: 3
                  name: Test Manager
                  status: Active
                  created_at: "2026-11-05T10:15:00.000000Z"
                  permissions:
                    module:
                      system-configuration:
                        menu:
                          user:
                            permission: [view]

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Request validation failed (for example missing, duplicate or `superadmin` name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              examples:
                missingName:
                  summary: Name missing
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The name field is required. "
                    errors:
                      name:
                        - The name field is required.
                duplicateName:
                  summary: Name already used
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The name has already been taken. "
                    errors:
                      name:
                        - The name has already been taken.

  /roles/{id}:
    put:
      tags:
        - Roles
      summary: Update role
      description: |
        Updates the role's name and status and **replaces** its permissions with the list sent.
        If `permissions` is missing or `[]`, all of the role's permissions are removed, so always
        send the full list. If `status` is missing, the current status is kept.

        Required permission: `module:system-configuration.menu:user-role.permission:edit`
      operationId: updateRole

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/RoleId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"

      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
              example:
                code: 200
                success: true
                message: Role updated successfully.
                data:
                  id: 3
                  name: Test Manager Updated
                  status: Active
                  created_at: "2026-11-05T10:15:00.000000Z"
                  permissions:
                    module:
                      system-configuration:
                        menu:
                          user-role:
                            permission: [view]
                          user:
                            permission: [view]

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/RoleNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ValidationError"

  /roles/{id}/status:
    patch:
      tags:
        - Roles
      summary: Change role status
      description: |
        Sets the role's status to `Active` or `Inactive`. Only the stored value changes;
        users with an `Inactive` role keep their permissions.

        Required permission: `module:system-configuration.menu:user-role.permission:change-status`
      operationId: updateRoleStatus

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/RoleId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Active, Inactive]
                  example: Inactive

      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
              example:
                code: 200
                success: true
                message: Status updated successfully.
                data:
                  id: 3
                  name: Test Manager
                  status: Inactive
                  created_at: "2026-11-05T10:15:00.000000Z"
                  permissions:
                    module: {}

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/RoleNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Status is missing or not `Active` / `Inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

  /branches:
    get:
      tags:
        - Branches
      summary: List branches
      description: |
        All branches of the logged-in user's company (super admin: every company). Soft-deleted
        branches are not listed. The list is **not** paginated and has no search or sort
        parameters. No sort order is set (the database usually returns them by ID).

        Required permission: `module:system-configuration.menu:branch.permission:view`
      operationId: listBranches

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Branch"
              example:
                code: 200
                success: true
                message: List Data
                data:
                  - id: 1
                    company_id: 1
                    name: Test Branch Main
                    email: main.branch@example.com
                    phone: "01700000101"
                    address: Test Road 1, Dhaka
                    is_default: "Yes"
                    status: Approved
                    created_at: "2026-11-05T10:15:00.000000Z"
                  - id: 2
                    company_id: 1
                    name: Test Branch Two
                    email: second.branch@example.com
                    phone: "01700000102"
                    address: Test Road 2, Chattogram
                    is_default: "NO"
                    status: Approved
                    created_at: "2026-11-05T10:20:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Branches
      summary: Create branch
      description: |
        Creates a branch for the logged-in user's company. The validation rules are the same
        as the web form (`admin/settings-branch-create`), read from the branch form settings.

        - `status` is always saved as `Approved`, even if another value is sent.
        - `phone` and `email` must be unique across **all** branches (every company, including
          soft-deleted branches).
        - Setting `is_default` to `Yes` does **not** change the old default branch to `NO`;
          update the old one yourself so the company keeps exactly one default branch.

        Required permission: `module:system-configuration.menu:branch.permission:create`
      operationId: createBranch

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"

      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Branch"
              example:
                code: 201
                success: true
                message: Branch created successfully.
                data:
                  id: 3
                  company_id: 1
                  name: Test Branch Three
                  email: third.branch@example.com
                  phone: "01700000103"
                  address: Test Road 3, Sylhet
                  is_default: "NO"
                  status: Approved
                  created_at: "2026-11-08T10:49:30.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/BranchValidationError"

  /branches/{id}:
    put:
      tags:
        - Branches
      summary: Update branch
      description: |
        Updates a branch (API version of the web edit form `admin/settings-branch-edit/{id}`).
        The validation rules are the same as the web form; the branch's own `phone` and `email`
        may be kept.

        **Send the full branch data.** Every field is set from the body, so a missing `email` or
        `address` is saved as `null`.

        - `status` is always saved as `Approved`, so updating an `Inactive` branch makes it active
          again. Use `PATCH /branches/{id}/status` afterwards if needed.
        - `company_id` is set to the logged-in user's company.
        - Setting `is_default` to `Yes` does **not** change the old default branch to `NO`.

        Required permission: `module:system-configuration.menu:branch.permission:edit`
      operationId: updateBranch

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BranchId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"

      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Branch"
              example:
                code: 200
                success: true
                message: Branch updated successfully.
                data:
                  id: 1
                  company_id: 1
                  name: Test Branch Main Updated
                  email: main.branch@example.com
                  phone: "01700000101"
                  address: Test Road 10, Dhaka
                  is_default: "Yes"
                  status: Approved
                  created_at: "2026-11-05T10:15:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BranchNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/BranchValidationError"

    delete:
      tags:
        - Branches
      summary: Delete branch
      description: |
        Soft-deletes a branch (`deleted_at` is set; the row stays in the database).

        The branch cannot be deleted (`409`) when:
        - it is the default branch (`is_default = Yes`), or
        - it is used by any store, stock summary, customer or supplier (`errors.used_in` lists which).

        Other tables (sales, purchases, ledger, …) are not checked.

        Required permission: `module:system-configuration.menu:branch.permission:delete`
      operationId: deleteBranch

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BranchId"

      responses:
        "200":
          description: Branch deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 3
              example:
                code: 200
                success: true
                message: Branch deleted successfully.
                data:
                  id: 3

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BranchNotFound"

        "409":
          description: The branch is the default branch or is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                defaultBranch:
                  summary: Default branch
                  value:
                    code: 409
                    success: false
                    message: Default branch cannot be deleted.
                    errors: null
                inUse:
                  summary: Branch in use
                  value:
                    code: 409
                    success: false
                    message: Branch is in use and cannot be deleted.
                    errors:
                      used_in: [stores, stock_summaries, customers]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

  /branches/{id}/status:
    patch:
      tags:
        - Branches
      summary: Change branch status
      description: |
        Sets the branch's status to `Approved` or `Inactive`. The default branch can also be set
        to `Inactive`; transactions without a branch are still saved to the default branch.

        Required permission: `module:system-configuration.menu:branch.permission:change-status`
      operationId: updateBranchStatus

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BranchId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Approved, Inactive]
                  example: Inactive

      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Branch"
              example:
                code: 200
                success: true
                message: Status updated successfully.
                data:
                  id: 2
                  company_id: 1
                  name: Test Branch Two
                  email: second.branch@example.com
                  phone: "01700000102"
                  address: Test Road 2, Chattogram
                  is_default: "NO"
                  status: Inactive
                  created_at: "2026-11-05T10:20:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BranchNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Status is missing or not `Approved` / `Inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

  /departments:
    get:
      tags:
        - Departments
      summary: List departments
      description: |
        Paginated list of the logged-in user's company departments (the same company filter as the
        web list `admin/settings-department-list`; this also applies to the super admin).
        Soft-deleted departments are not listed. The departments are in `data.items` and the
        pagination info in `data.pagination`.

        Required permission: `module:system-configuration.menu:department.permission:view`
      operationId: listDepartments

      security:
        - sessionCookie: []

      parameters:
        - name: search
          in: query
          description: Partial match on ID, name or status.
          schema:
            type: string
          example: acc
        - name: per_page
          in: query
          description: Items per page (1–100). Any other value falls back to `10`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort_by
          in: query
          description: Any other value falls back to `id`.
          schema:
            type: string
            enum: [id, name, status, created_at]
            default: id
        - name: sort_dir
          in: query
          description: Any value other than `asc` sorts descending.
          schema:
            type: string
            enum: [asc, desc]
            default: desc

      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Department"
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
              example:
                code: 200
                success: true
                message: List Data
                data:
                  items:
                    - id: 2
                      company_id: 1
                      name: Test Accounts
                      status: Approved
                      created_at: "2026-11-09T10:20:00.000000Z"
                    - id: 1
                      company_id: 1
                      name: Test HR
                      status: Inactive
                      created_at: "2026-11-09T10:15:00.000000Z"
                  pagination:
                    current_page: 1
                    per_page: 10
                    total: 2
                    last_page: 1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Departments
      summary: Create department
      description: |
        Creates a department for the logged-in user's company. The validation rules are the same
        as the web form (`admin/settings-department-create`), read from the department form
        settings, plus a unique name check.

        - `status` is always saved as `Approved`, even if another value is sent.
        - `name` must be unique within the logged-in user's company (not case-sensitive).
          Soft-deleted departments and other companies' departments are not counted.
          The web form does **not** have this check.

        Required permission: `module:system-configuration.menu:department.permission:create`
      operationId: createDepartment

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  $ref: "#/components/schemas/DepartmentName"

      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Department"
              example:
                code: 201
                success: true
                message: Department created successfully.
                data:
                  id: 3
                  company_id: 1
                  name: Test Store
                  status: Approved
                  created_at: "2026-11-09T10:30:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/DepartmentValidationError"

  /departments/{id}:
    put:
      tags:
        - Departments
      summary: Update department
      description: |
        Updates a department's name and status (API version of the web edit form
        `admin/settings-department-edit/{id}`). The validation rules are the same as the web form,
        plus a unique name check and a required status.

        - `name` must be unique within the logged-in user's company (not case-sensitive); the
          department's own name may be kept.
        - `status` is taken from the body (`Approved`, `Inactive` or `Pending`).
        - `company_id` is set to the logged-in user's company.

        Required permission: `module:system-configuration.menu:department.permission:edit`
      operationId: updateDepartment

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/DepartmentId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - status
              properties:
                name:
                  $ref: "#/components/schemas/DepartmentName"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending]
                  example: Inactive

      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Department"
              example:
                code: 200
                success: true
                message: Department updated successfully.
                data:
                  id: 1
                  company_id: 1
                  name: Test Human Resource
                  status: Inactive
                  created_at: "2026-11-09T10:15:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/DepartmentNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/DepartmentValidationError"

    delete:
      tags:
        - Departments
      summary: Delete department
      description: |
        Soft-deletes a department (`deleted_at` is set; the row stays in the database). A deleted
        department is no longer listed, returns `404` on every other endpoint, and its name can be
        used again.

        The department cannot be deleted (`409`) when it is used by any purchase requisition
        (`errors.used_in` lists which). Other tables are not checked. The web delete button does
        **not** have this check.

        Required permission: `module:system-configuration.menu:department.permission:delete`
      operationId: deleteDepartment

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/DepartmentId"

      responses:
        "200":
          description: Department deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 3
              example:
                code: 200
                success: true
                message: Department deleted successfully.
                data:
                  id: 3

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/DepartmentNotFound"

        "409":
          description: The department is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Department is in use and cannot be deleted.
                errors:
                  used_in: [purchase_requisitions]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

  /departments/{id}/status:
    patch:
      tags:
        - Departments
      summary: Change department status
      description: |
        Sets the department's status to `Approved` or `Inactive`.

        Required permission: `module:system-configuration.menu:department.permission:change-status`
      operationId: updateDepartmentStatus

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/DepartmentId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Approved, Inactive]
                  example: Inactive

      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Department"
              example:
                code: 200
                success: true
                message: Status updated successfully.
                data:
                  id: 2
                  company_id: 1
                  name: Test Accounts
                  status: Inactive
                  created_at: "2026-11-09T10:20:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/DepartmentNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Status is missing or not `Approved` / `Inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel session cookie set by `GET /csrf-token` and authenticated by `POST /login`.
        The actual cookie name comes from `SESSION_COOKIE` (default: the app name + `_session`).

  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token from `GET /csrf-token` or from the last login/logout response.
      schema:
        type: string

    RoleId:
      name: id
      in: path
      required: true
      description: Role ID. The `superadmin` role, an unknown ID or a non-numeric ID returns `404`.
      schema:
        type: integer
      example: 3

    BranchId:
      name: id
      in: path
      required: true
      description: |
        Branch ID. An unknown, soft-deleted or non-numeric ID, or a branch of another company
        (for users other than the super admin), returns `404`.
      schema:
        type: integer
      example: 2

    DepartmentId:
      name: id
      in: path
      required: true
      description: |
        Department ID. An unknown, soft-deleted or non-numeric ID returns `404`. Departments of
        other companies are not blocked.
      schema:
        type: integer
      example: 2

  schemas:
    SuccessEnvelope:
      type: object
      description: Wrapper used by every successful API response.
      required: [code, success, message, data]
      properties:
        code:
          type: integer
          description: Same as the HTTP status code.
          example: 200
        success:
          type: boolean
          const: true
          example: true
        message:
          type: string
          example: List Data
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: Wrapper used by errors returned from the API controllers.
      required: [code, success, message, errors]
      properties:
        code:
          type: integer
          description: Same as the HTTP status code.
          example: 404
        success:
          type: boolean
          const: false
          example: false
        message:
          type: string
          example: Not Found
        errors:
          description: Error details; `null`, a string or an object depending on the endpoint.
          type: [object, string, "null"]

    ValidationErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            code:
              example: 422
            message:
              type: string
              description: "`Validation Failed. ` followed by the first message of every invalid field."
              example: "Validation Failed. The name field is required. "
            errors:
              type: object
              description: Field name to list of messages.
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name:
                  - The name field is required.

    FrameworkError:
      type: object
      description: |
        Error written by Laravel or Spatie, not by the API controllers (no envelope).
        With `APP_DEBUG=true` it also has `exception`, `file`, `line` and `trace`.
      properties:
        message:
          type: string
          example: Unauthenticated.

    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

    User:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: test.user@example.com
        role_id:
          type: integer
          description: "`1` = super admin, `2` = company admin, others = custom roles."
          example: 3
        role:
          type: [object, "null"]
          description: Spatie role of the user. `null` when no Spatie role is assigned.
          properties:
            name:
              type: string
              example: Test Manager
            permissions:
              $ref: "#/components/schemas/PermissionTree"
        company_id:
          type: [integer, "null"]
          description: "`0` for the super admin."
          example: 1
        status:
          type: string
          example: Approved
        email_verified_at:
          type: [string, "null"]
          format: date-time
          example: null

    Branch:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          example: 1
        name:
          type: [string, "null"]
          example: Test Branch Two
        email:
          type: [string, "null"]
          format: email
          example: second.branch@example.com
        phone:
          type: [string, "null"]
          example: "01700000102"
        address:
          type: [string, "null"]
          example: Test Road 2, Chattogram
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "`Yes` = the company's default branch, used when a transaction has no branch."
          example: "NO"
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T10:20:00.000000Z"

    BranchRequest:
      type: object
      description: |
        Body for create and update. Rules come from the branch form settings (same as the web form).
        `status` is not taken from the body; the branch is always saved as `Approved`.
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Test Branch Three
        phone:
          type: string
          description: |
            Bangladeshi phone number (for example `01700000103`, `+8801700000103`).
            Must be unique across all branches.
          example: "01700000103"
        email:
          type: [string, "null"]
          format: email
          description: Must be unique across all branches.
          example: third.branch@example.com
        address:
          type: [string, "null"]
          maxLength: 200
          example: Test Road 3, Sylhet
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "Missing or `null` is saved as `null` (not a default branch)."
          example: "NO"

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for departments created by the super admin."
          example: 1
        name:
          type: [string, "null"]
          example: Test Accounts
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:20:00.000000Z"

    DepartmentName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the department form settings (same as the web form). Must be unique within
        the logged-in user's company (not case-sensitive, soft-deleted departments not counted).

        The database column holds only **55** characters: a longer name (56–100) passes validation
        but is saved cut to 55 characters.
      example: Test Store

    Decimal:
      type: [string, number]
      description: Decimal value. Usually a string such as `"21754.0000"`; can be the number `0`.
      example: "21754.0000"

    ProductRef:
      type: [object, "null"]
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Test Product A

    Dashboard:
      type: object
      properties:
        business_summary:
          $ref: "#/components/schemas/BusinessSummary"
        sales_and_collection:
          $ref: "#/components/schemas/SalesAndCollection"
        top_products:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        top_customers:
          type: array
          items:
            $ref: "#/components/schemas/TopCustomer"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/RecentTransaction"
        inventory_alert:
          type: array
          items:
            $ref: "#/components/schemas/InventoryAlert"

    BusinessSummary:
      type: object
      description: |
        Parallel arrays, one entry per day of the current month up to today. Index `0` is an
        opening entry dated the 1st of the month: its sales, purchases and collection are `0`,
        and its receivables/payables hold the opening balance. The other entries are that day's
        total (receivables/payables: that day's net change). The sum of each array is the
        month's total (receivables/payables: today's closing balance).
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
          example: ["2026-11-01", "2026-11-01", "2026-11-02"]
        totalSales:
          description: General sales + POS sales (`grand_total`).
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "7426.7500", "11080.0000"]
        totalPurchases:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "0.0000", "5890.0000"]
        totalCollection:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "10599.2500", "8775.0000"]
        totalAccountsReceivables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["486391.5667", "-3240.0000", "2305.0000"]
        totalAccountsPayables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["1457499.2185", "0.0000", "5890.0000"]

    SalesAndCollection:
      type: object
      description: Parallel arrays with 12 entries, one per month of the current year.
      properties:
        dates:
          type: array
          items:
            type: string
          example: ["Jan", "Feb", "Mar"]
        sales:
          description: General sales + POS sales for the month.
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["477766.5250", "428187.9000", "565990.3000"]
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["448329.7500", "493622.0650", "639015.9750"]

    TopProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        sales_id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        branch_id:
          type: [integer, "null"]
          example: 1
        store_id:
          type: [integer, "null"]
          example: 2
        id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        company_id:
          type: integer
          example: 1
        product:
          $ref: "#/components/schemas/ProductRef"

    TopCustomer:
      type: object
      properties:
        subtotal:
          $ref: "#/components/schemas/Decimal"
        customer_id:
          type: [integer, "null"]
          example: 3
        customerName:
          type: [string, "null"]
          example: Test Customer Ltd

    RecentTransaction:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-11-02"
        type:
          type: string
          enum: [purchase, sale]
          example: sale
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        product:
          $ref: "#/components/schemas/ProductRef"

    InventoryAlert:
      type: object
      properties:
        product_id:
          type: integer
          example: 11
        quantity:
          description: Current stock quantity.
          $ref: "#/components/schemas/Decimal"
        product:
          type: [object, "null"]
          properties:
            id:
              type: integer
              example: 11
            name:
              type: string
              example: Test Product B
            low_stock:
              description: Low-stock threshold set on the product.
              $ref: "#/components/schemas/Decimal"

    PermissionTree:
      type: object
      description: |
        Permission names `module:<module>.menu:<menu>.permission:<action>` grouped by module and
        menu. `module` is an empty object `{}` when there are no permissions.
      properties:
        module:
          type: object
          additionalProperties:
            type: object
            properties:
              menu:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    permission:
                      type: array
                      items:
                        type: string
      example:
        module:
          customer-manage:
            menu:
              customer:
                permission: [view, create, edit, delete, change-status]
          sales-transaction:
            menu:
              sales:
                permission: [view]

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Test Manager
        status:
          type: string
          enum: [Active, Inactive]
          example: Active
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T10:15:00.000000Z"
        permissions:
          $ref: "#/components/schemas/PermissionTree"

    RoleRequest:
      type: object
      description: |
        Body for create and update. `permissions` takes full permission names, not the tree.
        Build each name as `module:<module>.menu:<menu>.permission:<action>`.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 55
          description: Must be unique among `web` roles and cannot be `superadmin`.
          example: Test Manager
        status:
          type: string
          enum: [Active, Inactive]
          description: "Create: defaults to `Active`. Update: keeps the current status when missing."
          example: Active
        permissions:
          type: array
          description: Existing permission names (guard `web`), no duplicates.
          items:
            type: string
          example:
            - module:system-configuration.menu:user.permission:view
            - module:system-configuration.menu:user-role.permission:view

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 2
        last_page:
          type: integer
          example: 1

  responses:
    SessionUnavailable:
      description: No session for this origin. The origin is missing from `SANCTUM_STATEFUL_DOMAINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 400
            success: false
            message: Session is not available for this origin. Check SANCTUM_STATEFUL_DOMAINS.
            errors: null

    Unauthorized:
      description: Not logged in or the session has expired (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: Unauthenticated.

    CsrfMismatch:
      description: CSRF token is missing, invalid or expired. Call `GET /csrf-token` again (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: CSRF token mismatch.

    Forbidden:
      description: The user does not have the Spatie permission this endpoint needs (Spatie response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: User does not have the right permissions.

    RoleNotFound:
      description: No role with this ID, a non-numeric ID, or the `superadmin` role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    BranchNotFound:
      description: No branch with this ID, a non-numeric or soft-deleted ID, or a branch of another company.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    BranchValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingFields:
              summary: Name and phone missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. The phone field is required. "
                errors:
                  name:
                    - The name field is required.
                  phone:
                    - The phone field is required.
            duplicatePhone:
              summary: Phone already used by another branch
              value:
                code: 422
                success: false
                message: "Validation Failed. The phone has already been taken. "
                errors:
                  phone:
                    - The phone has already been taken.
            invalidDefault:
              summary: is_default is not Yes / NO
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected is default is invalid. "
                errors:
                  is_default:
                    - The selected is default is invalid.

    DepartmentNotFound:
      description: No department with this ID, or a non-numeric or soft-deleted ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    DepartmentValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingName:
              summary: Name missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. "
                errors:
                  name:
                    - The name field is required.
            duplicateName:
              summary: Name already used by another department of the company
              value:
                code: 422
                success: false
                message: "Validation Failed. The name has already been taken. "
                errors:
                  name:
                    - The name has already been taken.
            invalidStatus:
              summary: Update only — status missing or not Approved / Inactive / Pending
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          example:
            code: 422
            success: false
            message: "Validation Failed. The name field is required. "
            errors:
              name:
                - The name field is required.

    TooManyRequests:
      description: Too many login attempts. Limit is 5 requests per minute (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: Too Many Attempts.
