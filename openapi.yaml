        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-19T00:26:26.000000Z"

    DebitNoteReasonName:
      type: string
      minLength: 2
      maxLength: 55
      description: |
        2–55 characters (the size of the database column). Must be unique among reasons that are
        not soft-deleted (not case-sensitive).
      example: Discount Charge

    DebitNoteReasonAccountId:
      type: integer
      description: |
        Chart of accounts ID of a posted ledger account (`is_posted = 1`, not soft-deleted) — the
        web form's account dropdowns. `debit_id` and `credit_id` must be different.
      example: 11

    CreditNoteReason:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: [integer, "null"]
          example: 1
        name:
          type: [string, "null"]
          example: Discount
        debit_id:
          type: [integer, "null"]
          description: Chart of accounts ID of the posted ledger that is debited.
          example: 11
        credit_id:
          type: [integer, "null"]
          description: Chart of accounts ID of the posted ledger that is credited.
          example: 39
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-19T00:26:26.000000Z"

    CreditNoteReasonName:
      type: string
      minLength: 2
      maxLength: 55
      description: |
        2–55 characters (the size of the database column). Must be unique among reasons that are
        not soft-deleted (not case-sensitive).
      example: Discount

    CreditNoteReasonAccountId:
      type: integer
      description: |
        Chart of accounts ID of a posted ledger account (`is_posted = 1`, not soft-deleted) — the
        web form's account dropdowns. `debit_id` and `credit_id` must be different.
      example: 39

    InventoryAdjustmentReason:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: [integer, "null"]
          example: 1
        name:
          type: [string, "null"]
          example: Goods Damage
        debit_id:
          type: [integer, "null"]
          description: Chart of accounts ID of the posted ledger that is debited.
          example: 202
        credit_id:
          type: [integer, "null"]
          description: Chart of accounts ID of the posted ledger that is credited.
          example: 9
        adjustment_type:
          type: [string, "null"]
          description: Stock direction of adjustments that use this reason.
          enum: [In, Out, null]
          example: Out
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-23T07:48:18.000000Z"

    InventoryAdjustmentReasonName:
      type: string
      minLength: 2
      maxLength: 55
      description: |
        2–55 characters (the size of the database column). Must be unique among reasons that are
        not soft-deleted (not case-sensitive).
      example: Goods Damage

    InventoryAdjustmentReasonAccountId:
      type: integer
      description: |
        Chart of accounts ID of a posted ledger account (`is_posted = 1`, not soft-deleted) — the
        web form's account dropdowns. `debit_id` and `credit_id` must be different.
      example: 202

    InventoryAdjustmentType:
      type: string
      enum: [In, Out]
      description: Stock direction — the web form's Adjustment Type dropdown (setup data type 21).
      example: Out

    CostCenter:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        name:
          type: [string, "null"]
          example: Cost Center 1
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-01-01T00:45:50.000000Z"

    CostCenterName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        2–100 characters (the size of the database column). Must be unique among cost centers that
        are not soft-deleted, of any company (not case-sensitive).
      example: Finishing Unit

    NonInventory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        name:
          type: [string, "null"]
          example: Water
        price:
          type: [string, "null"]
          description: Decimal string with 6 places (`decimal(20,6)` column), or `null`.
          example: "0.000000"
        description:
          type: [string, "null"]
          example: null
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-01-01T00:46:08.000000Z"

    NonInventoryName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        2–100 characters (the size of the database column). Must be unique among non-inventories
        that are not soft-deleted, of any company (not case-sensitive).
      example: Gas

    NonInventoryPrice:
      type: [number, "null"]
      minimum: 0
      description: Optional unit price, 0 or more.
      example: 12.5

    NonInventoryDescription:
      type: [string, "null"]
      example: LPG

    AccountGroup:
      type: object
      properties:
        id:
          type: integer
          example: 13
        account_code:
          type: [string, "null"]
          example: ACG0000012
        name:
          type: [string, "null"]
          example: Fixed Assets
        account_type_id:
          type: [integer, "null"]
          example: 1
        account_type_name:
          type: [string, "null"]
          description: Name of the account type, or `null` when it does not exist.
          example: Assets
        parent_id:
          type: integer
          description: The root account the group is under.
          example: 1
        parent_name:
          type: [string, "null"]
          example: Assets
        is_posted:
          type: integer
          enum: [0, 1]
          description: |
            `0` = account group (parent account), `1` = posted ledger account. Accounts created or
            updated through this API are always `0`.
          example: 0
        status:
          type: string
          description: Plain string column; the API only sets `Approved` or `Inactive`.
          example: Approved
        branch_id:
          type: [integer, "null"]
          example: 0
        company_id:
          type: [integer, "null"]
          example: 1
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:02:07.000000Z"

    AccountGroupRequest:
      type: object
      required:
        - name
        - account_type_id
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          description: 2–255 characters. Does not have to be unique.
          example: Fixed Assets
        account_type_id:
          type: integer
          description: |
            An existing account type that is not soft-deleted (`1` Assets, `2` Liability,
            `3` Owner's Equity, `4` Income, `5` Expense).
          example: 1
        branch_id:
          type: [integer, "null"]
          description: Optional; saved as sent (`null` when not sent).
          example: null

    ChartOfAccount:
      type: object
      properties:
        id:
          type: integer
          example: 30
        account_code:
          type: [string, "null"]
          example: AC00000130
        name:
          type: [string, "null"]
          example: Test Ledger
        account_type:
          $ref: "#/components/schemas/NamedRef"
        group:
          $ref: "#/components/schemas/NamedRef"
        parent:
          $ref: "#/components/schemas/NamedRef"
        level:
          type: [integer, "null"]
          enum: [2, 3, null]
          description: "`2` = directly under an account group, `3` = under a level 2 account."
          example: 3
        is_posted:
          type: integer
          enum: [0, 1]
          description: "`1` = ledger account (transactions are posted to it), `0` = parent account."
          example: 1
        branch_id:
          type: [integer, "null"]
          example: null
        company_id:
          type: [integer, "null"]
          example: 1
        status:
          type: string
          description: Plain string column; the API only sets `Approved`, `Inactive`, `Pending` or `Cancel`.
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-11T09:41:23.000000Z"

    ChartOfAccountRequest:
      type: object
      description: |
        Account fields. Rules come from the chart of account form settings (same as the web form).
        `name` and `group_id` are required on create and update.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          description: Does not have to be unique.
          example: Test Ledger
        group_id:
          type: integer
          description: An account group — a direct child of a root account.
          example: 2
        parent_id:
          type: [integer, "null"]
          description: |
            Optional. A parent account (`is_posted` 0) directly under `group_id`; on update it
            cannot be the account itself.
          example: 29
        is_posted:
          type: [boolean, integer, string, "null"]
          description: "`true` / `1` / `\"on\"` = ledger account; anything else = parent account."
          example: true
        branch_id:
          type: [integer, "null"]
          example: null
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          description: Create only; optional, cannot be empty when sent, defaults to `Approved`. Ignored on update.
          example: Approved

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        code:
          type: [string, "null"]
          example: null
        name:
          type: [string, "null"]
          example: Silicone Softener WM-80
        category_id:
          type: [integer, "null"]
          example: 7
        category_name:
          type: [string, "null"]
          example: Silicone
        brand_id:
          type: [integer, "null"]
          example: 1
        brand_name:
          type: [string, "null"]
          example: Brand1
        unit_id:
          type: [integer, "null"]
          example: 1
        unit_name:
          type: [string, "null"]
          example: KG
        product_type_id:
          type: [integer, "null"]
          example: 3
        product_type_name:
          type: [string, "null"]
          example: Raw Material & Finished Good
        purchases_price:
          type: [string, "null"]
          description: Decimal string with 6 places, or `null`.
          example: "1.810000"
        sale_price:
          type: [string, "null"]
          description: Decimal string with 6 places, or `null`.
          example: "2.300000"
        sd_rate:
          type: [string, "null"]
          description: Supplementary duty rate, or `null`.
          example: null
        vat_rate:
          type: [string, "null"]
          description: VAT rate, or `null`.
          example: null
        low_stock:
          type: [string, "null"]
          description: Decimal string with 6 places, or `null`.
          example: "100.000000"
        description:
          type: [string, "null"]
          example: null
        image:
          type: [string, "null"]
          description: Path of the main image (the last of `images`), or `null`.
          example: null
        image_url:
          type: [string, "null"]
          description: Public URL of `image`, or `null`.
          example: null
        images:
          type: array
          description: |
            All images of the product. To keep an image in `PUT /products/{id}`, send its `path`
            in `images`.
          items:
            $ref: "#/components/schemas/ProductImage"
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:14:49.000000Z"

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        path:
          type: string
          example: public/uploads/product/223/4232e041-69da-4b1c-8cc5-672cf87969bc.png
        url:
          type: [string, "null"]
          description: Public URL (needs `php artisan storage:link` on the server).
          example: https://backend-fintrack360.eduguard360.com/storage/uploads/product/223/4232e041-69da-4b1c-8cc5-672cf87969bc.png

    ProductRequest:
      type: object
      description: |
        Product fields. Required / optional comes from the web form settings: `name` and `unit_id`
        are required on create. On update every field is optional (see the endpoint).
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: |
            2–100 characters. Must be unique among products that are not soft-deleted (all
            companies).
          example: Silicone Softener WM-90
        code:
          type: [string, "null"]
          maxLength: 20
          description: |
            Up to 20 characters. Must be unique among **all** products, including soft-deleted
            ones (database unique index). Not generated automatically.
          example: PID0001
        unit_id:
          type: integer
          description: An existing, not soft-deleted product unit.
          example: 1
        category_id:
          type: [integer, "null"]
          description: An existing, not soft-deleted category.
          example: 7
        brand_id:
          type: [integer, "null"]
          description: An existing, not soft-deleted brand.
          example: 1
        product_type_id:
          type: [integer, "null"]
          description: An existing, not soft-deleted product type.
          example: 3
        purchases_price:
          type: [number, "null"]
          minimum: 0
          example: 1.9
        sale_price:
          type: [number, "null"]
          minimum: 0
          example: 2.5
        sd_rate:
          type: [number, "null"]
          minimum: 0
          description: Supplementary duty rate.
          example: 0
        vat_rate:
          type: [number, "null"]
          minimum: 0
          example: 15
        low_stock:
          type: [number, "null"]
          minimum: 0
          example: 100
        description:
          type: [string, "null"]
          example: null
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          description: Optional; cannot be empty when sent. Create defaults to `Approved`.
          example: Approved
        images:
          type: array
          maxItems: 10
          description: |
            Up to 10 distinct paths. Each must be a path returned by `POST /products/images` to the
            logged-in user (and not yet cleaned up), or — on update — the `path` of one of the
            product's current images.
          items:
            type: string
          example:
            - public/uploads/product/tmp/2/4232e041-69da-4b1c-8cc5-672cf87969bc.png

    Decimal:
      type: [string, number]
      description: Decimal value. Usually a string such as `"21754.0000"`; can be the number `0`.
      example: "21754.0000"

    ProductRef:
      type: [object, "null"]
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Test Product A

    Dashboard:
      type: object
      properties:
        business_summary:
          $ref: "#/components/schemas/BusinessSummary"
        sales_and_collection:
          $ref: "#/components/schemas/SalesAndCollection"
        top_products:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        top_customers:
          type: array
          items:
            $ref: "#/components/schemas/TopCustomer"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/RecentTransaction"
        inventory_alert:
          type: array
          items:
            $ref: "#/components/schemas/InventoryAlert"

    BusinessSummary:
      type: object
      description: |
        Parallel arrays, one entry per day of the current month up to today. Index `0` is an
        opening entry dated the 1st of the month: its sales, purchases and collection are `0`,
        and its receivables/payables hold the opening balance. The other entries are that day's
        total (receivables/payables: that day's net change). The sum of each array is the
        month's total (receivables/payables: today's closing balance).
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
          example: ["2026-11-01", "2026-11-01", "2026-11-02"]
        totalSales:
          description: General sales + POS sales (`grand_total`).
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "7426.7500", "11080.0000"]
        totalPurchases:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "0.0000", "5890.0000"]
        totalCollection:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "10599.2500", "8775.0000"]
        totalAccountsReceivables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["486391.5667", "-3240.0000", "2305.0000"]
        totalAccountsPayables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["1457499.2185", "0.0000", "5890.0000"]

    SalesAndCollection:
      type: object
      description: Parallel arrays with 12 entries, one per month of the current year.
      properties:
        dates:
          type: array
          items:
            type: string
          example: ["Jan", "Feb", "Mar"]
        sales:
          description: General sales + POS sales for the month.
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["477766.5250", "428187.9000", "565990.3000"]
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["448329.7500", "493622.0650", "639015.9750"]

    TopProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        sales_id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        branch_id:
          type: [integer, "null"]
          example: 1
        store_id:
          type: [integer, "null"]
          example: 2
        id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        company_id:
          type: integer
          example: 1
        product:
          $ref: "#/components/schemas/ProductRef"

    TopCustomer:
      type: object
      properties:
        subtotal:
          $ref: "#/components/schemas/Decimal"
        customer_id:
          type: [integer, "null"]
          example: 3
        customerName:
          type: [string, "null"]
          example: Test Customer Ltd

    RecentTransaction:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-11-02"
        type:
          type: string
          enum: [purchase, sale]
          example: sale
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        product:
          $ref: "#/components/schemas/ProductRef"

    InventoryAlert:
      type: object
      properties:
        product_id:
          type: integer
          example: 11
        quantity:
          description: Current stock quantity.
          $ref: "#/components/schemas/Decimal"
        product:
          type: [object, "null"]
          properties:
            id:
              type: integer
              example: 11
            name:
              type: string
              example: Test Product B
            low_stock:
              description: Low-stock threshold set on the product.
              $ref: "#/components/schemas/Decimal"

    PermissionTree:
      type: object
      description: |
        Permission names `module:<module>.menu:<menu>.permission:<action>` grouped by module and
        menu. `module` is an empty object `{}` when there are no permissions.
      properties:
        module:
          type: object
          additionalProperties:
            type: object
            properties:
              menu:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    permission:
                      type: array
                      items:
                        type: string
      example:
        module:
          customer-manage:
            menu:
              customer:
                permission: [view, create, edit, delete, change-status]
          sales-transaction:
            menu:
              sales:
                permission: [view]

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Test Manager
        status:
          type: string
          enum: [Active, Inactive]
          example: Active
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T10:15:00.000000Z"
        permissions:
          $ref: "#/components/schemas/PermissionTree"

    RoleRequest:
      type: object
      description: |
        Body for create and update. `permissions` takes full permission names, not the tree.
        Build each name as `module:<module>.menu:<menu>.permission:<action>`.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 55
          description: Must be unique among `web` roles and cannot be `superadmin`.
          example: Test Manager
        status:
          type: string
          enum: [Active, Inactive]
          description: "Create: defaults to `Active`. Update: keeps the current status when missing."
          example: Active
        permissions:
          type: array
          description: Existing permission names (guard `web`), no duplicates.
          items:
            type: string
          example:
            - module:system-configuration.menu:user.permission:view
            - module:system-configuration.menu:user-role.permission:view

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 2
        last_page:
          type: integer
          example: 1

  responses:
    SessionUnavailable:
      description: No session for this origin. The origin is missing from `SANCTUM_STATEFUL_DOMAINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 400
            success: false
            message: Session is not available for this origin. Check SANCTUM_STATEFUL_DOMAINS.
            errors: null

    Unauthorized:
      description: Not logged in or the session has expired (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: Unauthenticated.

    CsrfMismatch:
      description: CSRF token is missing, invalid or expired. Call `GET /csrf-token` again (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: CSRF token mismatch.

    Forbidden:
      description: The user does not have the Spatie permission this endpoint needs (Spatie response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: User does not have the right permissions.

    RoleNotFound:
      description: No role with this ID, a non-numeric ID, or the `superadmin` role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    BranchNotFound:
      description: No branch with this ID, a non-numeric or soft-deleted ID, or a branch of another company.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    BranchValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingFields:
              summary: Name and phone missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. The phone field is required. "
                errors:
                  name:
                    - The name field is required.
                  phone:
                    - The phone field is required.
            duplicatePhone:
              summary: Phone already used by another branch
              value:
                code: 422
                success: false
                message: "Validation Failed. The phone has already been taken. "
                errors:
                  phone:
                    - The phone has already been taken.
            invalidDefault:
              summary: is_default is not Yes / NO
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected is default is invalid. "
                errors:
                  is_default:
                    - The selected is default is invalid.

    StoreNotFound:
      description: No store with this ID, or a non-numeric or soft-deleted ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
