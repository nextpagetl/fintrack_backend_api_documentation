        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/EmployeeId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
            examples:
              designationOnly:
                summary: Change only the designation
                value:
                  designation: Area Manager
              changeSupervisor:
                summary: Move under another supervisor and change status
                value:
                  parent_id: 4
                  status: Inactive
              clearEmail:
                summary: Remove the email and the supervisor
                value:
                  email: ""
                  parent_id: null

      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Employee"
              example:
                code: 200
                success: true
                message: Employee updated successfully.
                data:
                  id: 3
                  company_id: 1
                  branch_id: 1
                  branch:
                    id: 1
                    name: Test Branch
                  parent_id: 2
                  supervisor:
                    id: 2
                    name: Test Supervisor
                  name: Test Employee
                  designation: Area Manager
                  email: test.employee@example.com
                  phone: "01700000001"
                  address: Test Road 1, Test City
                  status: Approved
                  created_at: "2025-01-18T10:02:08.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/EmployeeNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/EmployeeValidationError"

    delete:
      tags:
        - Employees
      summary: Delete employee
      description: |
        Soft-deletes an employee (`deleted_at` is set; the row stays in the database). A deleted
        employee is no longer listed, returns `404` on every other endpoint, and its email and
        phone can be used again.

        The employee cannot be deleted (`409`) when it is still used; `errors.used_in` lists where
        (soft-deleted rows are not counted):

        - `customers.sr_id`, `sales.sr_id`, `sale_return_wihout_refs.sr_id`,
          `sale_commission_payments.sr_id` — as sales representative
        - `task_creates.employee_id` — in tasks
        - `employees.parent_id` — as supervisor of other employees
        - `users` — assigned to a user as supervisor (`sv_id`) or sales representative (`sr_ids`)

        The web deletes without this check; the API blocks the delete on the server.

        Required permission: `module:system-configuration.menu:employee.permission:delete`
      operationId: deleteEmployee

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/EmployeeId"

      responses:
        "200":
          description: Employee deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 23
              example:
                code: 200
                success: true
                message: Employee deleted successfully.
                data:
                  id: 23

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/EmployeeNotFound"

        "409":
          description: The employee is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Employee is in use and cannot be deleted.
                errors:
                  used_in: [customers.sr_id, sales.sr_id, users]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

