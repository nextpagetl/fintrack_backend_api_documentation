  /bank-accounts:
    get:
      tags:
        - Bank Accounts
      summary: List bank accounts
      description: |
        Paginated list of the logged-in user's company bank accounts (the same company filter as the
        web list `admin/account-setup-bank-account-list`; this also applies to the super admin).
        Soft-deleted bank accounts are not listed. The bank accounts are in `data.items` and the
        pagination info in `data.pagination`.

        Required permission: `module:accounts-setup.menu:bank.permission:view`
      operationId: listBankAccounts

      security:
        - sessionCookie: []

      parameters:
        - name: search
          in: query
          description: Partial match on ID, bank name, account name, account number, branch or status.
          schema:
            type: string
          example: Islami
        - name: per_page
          in: query
          description: Items per page (1–100). Any other value falls back to `10`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort_by
          in: query
          description: Any other value falls back to `id`.
          schema:
            type: string
