      summary: Update debit note reason
      description: |
        Updates a debit note reason (API version of the web edit form
        `admin/account-setup-debit-note-reason-edit/{id}`). This is a **partial update**: every
        field is optional, and a field that is not sent keeps its current value.

        - `name`, `debit_id` and `credit_id` use the same rules as create; the reason's own name
          may be kept. The "debit and credit must be different" check runs only when one of the
          two accounts is sent.
        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`).
