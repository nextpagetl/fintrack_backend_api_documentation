components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel session cookie set by `GET /csrf-token` and authenticated by `POST /login`.
        The actual cookie name comes from `SESSION_COOKIE` (default: the app name + `_session`).

  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token from `GET /csrf-token` or from the last login/logout response.
      schema:
        type: string

    RoleId:
      name: id
      in: path
      required: true
      description: Role ID. The `superadmin` role, an unknown ID or a non-numeric ID returns `404`.
      schema:
        type: integer
      example: 3

    BranchId:
      name: id
      in: path
      required: true
      description: |
        Branch ID. An unknown, soft-deleted or non-numeric ID, or a branch of another company
        (for users other than the super admin), returns `404`.
      schema:
        type: integer
      example: 2

    DepartmentId:
      name: id
      in: path
      required: true
      description: |
        Department ID. An unknown, soft-deleted or non-numeric ID returns `404`. Departments of
        other companies are not blocked.
      schema:
        type: integer
      example: 2

    CustomerGroupId:
      name: id
      in: path
      required: true
      description: |
        Customer group ID. An unknown, soft-deleted or non-numeric ID, or a customer group of another company,
        returns `404`.
      schema:
        type: integer
      example: 2

    SupplierGroupId:
      name: id
      in: path
      required: true
      description: |
        Supplier group ID. An unknown, soft-deleted or non-numeric ID, or a supplier group of another company,
        returns `404`.
      schema:
        type: integer
      example: 2

    UnitId:
      name: id
      in: path
      required: true
      description: |
        Unit ID. An unknown, soft-deleted or non-numeric ID, or a unit of another company,
        returns `404`.
      schema:
        type: integer
      example: 2

    ProductTypeId:
      name: id
      in: path
      required: true
      description: |
        Product type ID. An unknown, soft-deleted or non-numeric ID, or a product type of another company,
        returns `404`.
      schema:
        type: integer
      example: 2

    BankAccountId:
      name: id
      in: path
      required: true
      description: |
        Bank account ID. An unknown, soft-deleted or non-numeric ID, or a bank account of another
        company, returns `404`.
      schema:
        type: integer
      example: 2

    AccountTypeId:
      name: id
      in: path
      required: true
      description: |
        Account type ID. An unknown, soft-deleted or non-numeric ID returns `404`. Account types of
        other companies are not blocked.
      schema:
        type: integer
      example: 4

  schemas:
    SuccessEnvelope:
      type: object
      description: Wrapper used by every successful API response.
      required: [code, success, message, data]
      properties:
        code:
          type: integer
          description: Same as the HTTP status code.
          example: 200
        success:
          type: boolean
          const: true
          example: true
        message:
          type: string
          example: List Data
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: Wrapper used by errors returned from the API controllers.
      required: [code, success, message, errors]
      properties:
        code:
          type: integer
          description: Same as the HTTP status code.
          example: 404
        success:
          type: boolean
          const: false
          example: false
        message:
          type: string
          example: Not Found
        errors:
          description: Error details; `null`, a string or an object depending on the endpoint.
          type: [object, string, "null"]

    ValidationErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            code:
              example: 422
            message:
              type: string
              description: "`Validation Failed. ` followed by the first message of every invalid field."
              example: "Validation Failed. The name field is required. "
            errors:
              type: object
              description: Field name to list of messages.
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name:
                  - The name field is required.

    FrameworkError:
      type: object
      description: |
        Error written by Laravel or Spatie, not by the API controllers (no envelope).
        With `APP_DEBUG=true` it also has `exception`, `file`, `line` and `trace`.
      properties:
        message:
          type: string
          example: Unauthenticated.

    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

    User:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: test.user@example.com
        role_id:
          type: integer
          description: "`1` = super admin, `2` = company admin, others = custom roles."
          example: 3
        role:
          type: [object, "null"]
          description: Spatie role of the user. `null` when no Spatie role is assigned.
          properties:
            name:
              type: string
              example: Test Manager
            permissions:
              $ref: "#/components/schemas/PermissionTree"
        company_id:
          type: [integer, "null"]
          description: "`0` for the super admin."
          example: 1
        status:
          type: string
          example: Approved
        email_verified_at:
          type: [string, "null"]
          format: date-time
          example: null

    Branch:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          example: 1
        name:
          type: [string, "null"]
          example: Test Branch Two
        email:
          type: [string, "null"]
          format: email
          example: second.branch@example.com
        phone:
          type: [string, "null"]
          example: "01700000102"
        address:
          type: [string, "null"]
          example: Test Road 2, Chattogram
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "`Yes` = the company's default branch, used when a transaction has no branch."
          example: "NO"
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T10:20:00.000000Z"

    BranchRequest:
      type: object
      description: |
        Body for create and update. Rules come from the branch form settings (same as the web form).
        `status` is not taken from the body; the branch is always saved as `Approved`.
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Test Branch Three
        phone:
          type: string
          description: |
            Bangladeshi phone number (for example `01700000103`, `+8801700000103`).
            Must be unique across all branches.
          example: "01700000103"
        email:
          type: [string, "null"]
          format: email
          description: Must be unique across all branches.
          example: third.branch@example.com
        address:
          type: [string, "null"]
          maxLength: 200
          example: Test Road 3, Sylhet
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "Missing or `null` is saved as `null` (not a default branch)."
          example: "NO"

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for departments created by the super admin."
          example: 1
        name:
          type: [string, "null"]
          example: Test Accounts
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:20:00.000000Z"

    DepartmentName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the department form settings (same as the web form). Must be unique within
        the logged-in user's company (not case-sensitive, soft-deleted departments not counted).

        The database column holds only **55** characters: a longer name (56–100) passes validation
        but is saved cut to 55 characters.
      example: Test Store

    CustomerGroup:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for customer groups created by the super admin."
          example: 1
        name:
          type: [string, "null"]
          example: Wholesale
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:20:00.000000Z"

    CustomerGroupName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the customer group form settings (same as the web form), plus a 100-character
        limit (the size of the database column). Must be unique within the logged-in user's
        company (not case-sensitive, soft-deleted customer groups not counted).
      example: Wholesale Partner

    SupplierGroup:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for supplier groups created by the super admin."
          example: 1
        name:
          type: [string, "null"]
          example: Importer
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:20:00.000000Z"

    SupplierGroupName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the supplier group form settings (same as the web form), plus a 100-character
        limit (the size of the database column). Must be unique within the logged-in user's
        company (not case-sensitive, soft-deleted supplier groups not counted).
      example: Local Supplier

    Unit:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for units created by the super admin."
          example: 1
        name:
          type: [string, "null"]
          example: KG
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:20:00.000000Z"

    UnitName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the unit form settings (same as the web form), plus a 100-character
        limit (the size of the database column). Must be unique within the logged-in user's
        company (not case-sensitive, soft-deleted units not counted).
      example: PCS

    ProductType:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for product types created by the super admin."
          example: 1
        name:
          type: [string, "null"]
          example: Raw Material
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:20:00.000000Z"

    ProductTypeName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the product type form settings (same as the web form), plus a 100-character
        limit (the size of the database column). Must be unique within the logged-in user's
        company (not case-sensitive, soft-deleted product types not counted).
      example: Semi Finished Good

    BankAccount:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          description: "`0` for bank accounts created by the super admin."
          example: 1
        bank_name:
          type: [string, "null"]
          example: Dutch-Bangla Bank Limited (DBBL)
        account_name:
          type: [string, "null"]
          example: Test Ltd
        account_number:
          type: [string, "null"]
          example: "1234567890"
        branch:
          type: [string, "null"]
          example: Motijheel
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:02:06.000000Z"

    BankName:
      type: string
      minLength: 2
      maxLength: 100
      description: |
        Rules come from the bank form settings (same as the web form). Must be unique within the
        logged-in user's company (not case-sensitive, soft-deleted bank accounts not counted).
      example: Test Bank Limited

    AccountType:
      type: object
      properties:
        id:
          type: integer
          example: 4
        company_id:
          type: integer
          example: 1
        name:
          type: string
          example: Income
        status:
          type: string
          description: Plain string column; the API only sets `Approved` or `Inactive`.
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:02:09.000000Z"

    Decimal:
      type: [string, number]
      description: Decimal value. Usually a string such as `"21754.0000"`; can be the number `0`.
      example: "21754.0000"

    ProductRef:
      type: [object, "null"]
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Test Product A

    Dashboard:
      type: object
      properties:
        business_summary:
          $ref: "#/components/schemas/BusinessSummary"
        sales_and_collection:
          $ref: "#/components/schemas/SalesAndCollection"
        top_products:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        top_customers:
          type: array
          items:
            $ref: "#/components/schemas/TopCustomer"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/RecentTransaction"
        inventory_alert:
          type: array
          items:
            $ref: "#/components/schemas/InventoryAlert"

    BusinessSummary:
      type: object
      description: |
        Parallel arrays, one entry per day of the current month up to today. Index `0` is an
        opening entry dated the 1st of the month: its sales, purchases and collection are `0`,
        and its receivables/payables hold the opening balance. The other entries are that day's
        total (receivables/payables: that day's net change). The sum of each array is the
        month's total (receivables/payables: today's closing balance).
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
          example: ["2026-11-01", "2026-11-01", "2026-11-02"]
        totalSales:
          description: General sales + POS sales (`grand_total`).
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "7426.7500", "11080.0000"]
        totalPurchases:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "0.0000", "5890.0000"]
        totalCollection:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "10599.2500", "8775.0000"]
        totalAccountsReceivables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["486391.5667", "-3240.0000", "2305.0000"]
        totalAccountsPayables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["1457499.2185", "0.0000", "5890.0000"]

    SalesAndCollection:
      type: object
      description: Parallel arrays with 12 entries, one per month of the current year.
      properties:
        dates:
          type: array
          items:
            type: string
          example: ["Jan", "Feb", "Mar"]
        sales:
          description: General sales + POS sales for the month.
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["477766.5250", "428187.9000", "565990.3000"]
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["448329.7500", "493622.0650", "639015.9750"]

    TopProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        sales_id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        branch_id:
          type: [integer, "null"]
          example: 1
        store_id:
          type: [integer, "null"]
          example: 2
        id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        company_id:
          type: integer
          example: 1
        product:
          $ref: "#/components/schemas/ProductRef"

    TopCustomer:
      type: object
      properties:
        subtotal:
          $ref: "#/components/schemas/Decimal"
        customer_id:
          type: [integer, "null"]
          example: 3
        customerName:
          type: [string, "null"]
          example: Test Customer Ltd

    RecentTransaction:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-11-02"
        type:
          type: string
          enum: [purchase, sale]
          example: sale
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        product:
          $ref: "#/components/schemas/ProductRef"

    InventoryAlert:
      type: object
      properties:
        product_id:
          type: integer
          example: 11
        quantity:
          description: Current stock quantity.
          $ref: "#/components/schemas/Decimal"
        product:
          type: [object, "null"]
          properties:
            id:
              type: integer
              example: 11
            name:
              type: string
              example: Test Product B
            low_stock:
              description: Low-stock threshold set on the product.
              $ref: "#/components/schemas/Decimal"

    PermissionTree:
      type: object
      description: |
        Permission names `module:<module>.menu:<menu>.permission:<action>` grouped by module and
        menu. `module` is an empty object `{}` when there are no permissions.
      properties:
        module:
          type: object
          additionalProperties:
            type: object
            properties:
              menu:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    permission:
                      type: array
                      items:
                        type: string
      example:
        module:
          customer-manage:
            menu:
              customer:
                permission: [view, create, edit, delete, change-status]
          sales-transaction:
            menu:
              sales:
                permission: [view]

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Test Manager
        status:
          type: string
          enum: [Active, Inactive]
          example: Active
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T10:15:00.000000Z"
        permissions:
          $ref: "#/components/schemas/PermissionTree"

    RoleRequest:
      type: object
      description: |
        Body for create and update. `permissions` takes full permission names, not the tree.
        Build each name as `module:<module>.menu:<menu>.permission:<action>`.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 55
          description: Must be unique among `web` roles and cannot be `superadmin`.
          example: Test Manager
        status:
          type: string
          enum: [Active, Inactive]
          description: "Create: defaults to `Active`. Update: keeps the current status when missing."
          example: Active
        permissions:
          type: array
          description: Existing permission names (guard `web`), no duplicates.
          items:
            type: string
          example:
            - module:system-configuration.menu:user.permission:view
            - module:system-configuration.menu:user-role.permission:view

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 2
        last_page:
          type: integer
          example: 1

  responses:
    SessionUnavailable:
      description: No session for this origin. The origin is missing from `SANCTUM_STATEFUL_DOMAINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 400
            success: false
            message: Session is not available for this origin. Check SANCTUM_STATEFUL_DOMAINS.
            errors: null

    Unauthorized:
      description: Not logged in or the session has expired (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: Unauthenticated.

    CsrfMismatch:
      description: CSRF token is missing, invalid or expired. Call `GET /csrf-token` again (Laravel response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: CSRF token mismatch.

    Forbidden:
      description: The user does not have the Spatie permission this endpoint needs (Spatie response, no envelope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FrameworkError"
          example:
            message: User does not have the right permissions.

    RoleNotFound:
      description: No role with this ID, a non-numeric ID, or the `superadmin` role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    BranchNotFound:
      description: No branch with this ID, a non-numeric or soft-deleted ID, or a branch of another company.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    BranchValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingFields:
              summary: Name and phone missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. The phone field is required. "
                errors:
                  name:
                    - The name field is required.
                  phone:
                    - The phone field is required.
            duplicatePhone:
              summary: Phone already used by another branch
              value:
                code: 422
                success: false
                message: "Validation Failed. The phone has already been taken. "
                errors:
                  phone:
                    - The phone has already been taken.
            invalidDefault:
              summary: is_default is not Yes / NO
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected is default is invalid. "
                errors:
                  is_default:
                    - The selected is default is invalid.

    DepartmentNotFound:
      description: No department with this ID, or a non-numeric or soft-deleted ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    DepartmentValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingName:
              summary: Name missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. "
                errors:
                  name:
                    - The name field is required.
            duplicateName:
              summary: Name already used by another department of the company
              value:
                code: 422
                success: false
                message: "Validation Failed. The name has already been taken. "
                errors:
                  name:
                    - The name has already been taken.
            invalidStatus:
              summary: Update only — status missing or not Approved / Inactive / Pending
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

    CustomerGroupNotFound:
      description: No customer group with this ID in the logged-in user's company, or a non-numeric or soft-deleted ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    CustomerGroupValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingName:
              summary: Name missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. "
