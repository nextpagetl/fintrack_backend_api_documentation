              properties:
                name:
                  $ref: "#/components/schemas/DebitNoteReasonName"
                debit_id:
                  $ref: "#/components/schemas/DebitNoteReasonAccountId"
                credit_id:
                  $ref: "#/components/schemas/DebitNoteReasonAccountId"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Pending
            examples:
              nameOnly:
