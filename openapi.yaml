  /products/images:
    post:
      tags:
        - Products
      summary: Upload product image
      description: |
        Step 1 of 2 for product images: call this as soon as a file is chosen. The image is resized
        to **800×500** (same as the web upload) and kept in the logged-in user's **temporary**
        folder (`public/uploads/product/tmp/{user_id}/`). Nothing is saved in the database.

        Step 2: send the returned `data.path` in `images` to `POST /products` or
        `PUT /products/{id}` when the user saves. Show `data.url` as the preview.

        A temporary image that is not saved with a product is deleted by the daily cleanup
        (02:00 Asia/Dhaka) once it is older than 24 hours; sending its path after that returns `422`
        and the file must be uploaded again. The URL works only when the server has
        `php artisan storage:link`.

        Required permission: `module:product-manage.menu:product.permission:create` **or**
        `module:product-manage.menu:product.permission:edit`
      operationId: uploadProductImage

