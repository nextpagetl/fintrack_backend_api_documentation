openapi: 3.1.0

info:
  title: FinTrack360 Backend API
  version: 1.5.0
  description: |
    FinTrack360 Backend REST API Documentation.

    This specification documents the routes defined in `routes/api.php`.

    ## Authentication
    The API uses **Laravel Sanctum SPA (session cookie) authentication**, not bearer tokens.

    1. Call `GET /csrf-token` to start a session and get a CSRF token.
    2. Call `POST /login` with the `X-CSRF-TOKEN` header. On success the session cookie
       is authenticated and a new `csrf_token` is returned.
    3. Send the session cookie and the latest `X-CSRF-TOKEN` with every following
       `POST`, `PUT`, `PATCH` and `DELETE` request (for example `POST /logout`, `PUT /roles/{id}`).

    ## Response format
    Every response written by the API controllers uses the same envelope:

    ```json
    // success
    { "code": 200, "success": true,  "message": "List Data", "data": { } }
    // error
    { "code": 404, "success": false, "message": "Not Found", "errors": "Data Not Found" }
    ```

    `code` in the body is the same as the HTTP status code. `data` / `errors` change per
    endpoint and are described below.

    A few errors come from Laravel or Spatie directly and do **not** use the envelope; their
    body is only `{ "message": "..." }`:

    | Status | When | `message` |
    |---|---|---|
    | 401 | Not logged in / session expired | `Unauthenticated.` |
    | 403 | Missing Spatie permission | `User does not have the right permissions.` |
    | 419 | CSRF token missing or wrong | `CSRF token mismatch.` |
    | 429 | More than 5 login attempts per minute | `Too Many Attempts.` |

    When the server runs with `APP_DEBUG=true`, these framework errors also contain
    `exception`, `file`, `line` and `trace`. Production must run with `APP_DEBUG=false`.

    ## Permissions
    Role, branch, department, customer group, supplier group, unit, product type, bank account and
    account type endpoints also need a Spatie permission, named
    `module:<module>.menu:<menu>.permission:<action>`. The required permission is listed in
    each endpoint's description; without it the API returns `403`. The `superadmin` role
    passes every permission check.

    The client origin must be listed in `SANCTUM_STATEFUL_DOMAINS`, otherwise the
    session endpoints return `400`. Browser clients must send requests with credentials
    (`withCredentials: true` / `credentials: "include"`).

    ## Server requirement
    The installed packages (Symfony 8.1) need **PHP 8.4 or newer**. On an older PHP every
    request fails with a PHP parse error before reaching the API.

  contact:
    name: FinTrack360 API Support

servers:
  - url: https://backend-fintrack360.eduguard360.com/api
    description: Demo server

tags:
  - name: Authentication
    description: Session-based login and logout (Sanctum SPA)
  - name: User
    description: The currently logged-in user
  - name: Dashboard
    description: Company dashboard data
  - name: Roles
    description: User role management (Spatie permission)
  - name: Branches
    description: Branch management (Settings → Branch)
  - name: Departments
    description: Department management (Settings → Department)
  - name: Customer Groups
    description: Customer group management (Customer Manage → Customer Group)
  - name: Supplier Groups
    description: Supplier group management (Supplier Manage → Supplier Group)
  - name: Units
    description: Product unit management (Product Manage → Unit)
  - name: Product Types
    description: Product type management (Product Manage → Product Type)
  - name: Bank Accounts
    description: Bank account management (Accounts Setup → Bank)
  - name: Account Types
    description: Account type list and status (Accounts Setup → Account Type)

paths:
  /csrf-token:
    get:
      tags:
        - Authentication
      summary: Get CSRF token
      description: |
        Starts a session and returns a CSRF token. Cross-origin SPA clients use this
        because they cannot read the `XSRF-TOKEN` cookie. Send the token in the
        `X-CSRF-TOKEN` header on `POST /login` and `POST /logout`.
      operationId: getCsrfToken

      security: []

      responses:
        "200":
          description: CSRF token returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 200
                success: true
                message: CSRF token
                data:
                  csrf_token: MNO0IvZ2M6xxELP5CM9lYysT0RJL9d4wIKglPXA8

        "400":
          $ref: "#/components/responses/SessionUnavailable"

  /login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticates the user with the web session guard. Only users with
        status `Approved` can log in. Limited to 5 requests per minute.
      operationId: login

      security: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: test.user@example.com
                password:
                  type: string
                  format: password
                  example: Test@1234
                remember:
                  type: boolean
                  description: Keep the user logged in ("remember me").
                  default: false
                  example: false

      responses:
        "200":
          description: Login successful. The session is now authenticated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 200
                success: true
                message: Login successful.
                data:
                  csrf_token: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "400":
          $ref: "#/components/responses/SessionUnavailable"

        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 401
                success: false
                message: Invalid email or password.
                errors: null

        "403":
          description: |
            The account exists but its status is not `Approved`. The session is reset, so use
            the new `csrf_token` in `errors` for the next request.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - type: object
                    properties:
                      errors:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 403
                success: false
                message: Your account is not active.
                errors:
                  csrf_token: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The email must be a valid email address. "
                errors:
                  email:
                    - The email must be a valid email address.

        "429":
          $ref: "#/components/responses/TooManyRequests"

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logs the user out, invalidates the session and returns a new CSRF token.
      operationId: logout

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CsrfToken"
              example:
                code: 200
                success: true
                message: Logged out successfully.
                data:
                  csrf_token: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

  /me:
    get:
      tags:
        - User
      summary: Get current user
      description: |
        Returns the details of the logged-in user, with the user's Spatie role and its
        permissions grouped as a tree (see `PermissionTree`). `role` is `null` when the
        user has no Spatie role assigned (for example users that only have an old
        `user_roles` role); such users get `403` on every permission-protected endpoint.
      operationId: getCurrentUser

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
              examples:
                withRole:
                  summary: User with a Spatie role
                  value:
                    code: 200
                    success: true
                    message: Detail data
                    data:
                      user:
                        id: 5
                        name: Test User
                        email: test.user@example.com
                        role_id: 3
                        role:
                          name: Test Manager
                          permissions:
                            module:
                              system-configuration:
                                menu:
                                  user-role:
                                    permission: [view, create, edit, change-status]
                                  user:
                                    permission: [view]
                        company_id: 1
                        status: Approved
                        email_verified_at: null
                withoutRole:
                  summary: User without a Spatie role
                  value:
                    code: 200
                    success: true
                    message: Detail data
                    data:
                      user:
                        id: 6
                        name: Test Sales User
                        email: test.sales@example.com
                        role_id: 8
                        role: null
                        company_id: 1
                        status: Approved
                        email_verified_at: null

        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard data
      description: |
        Returns all dashboard sections for the logged-in user's company in one response.

        - `business_summary`: day-by-day totals from the 1st of the current month to today.
        - `sales_and_collection`: month-by-month totals for the current year (Jan–Dec).
        - `top_products`: products by total sales amount, all time, highest first.
        - `top_customers`: customers by total sales subtotal, highest first.
        - `recent_transactions`: up to 15 purchase lines and 15 sale lines, newest date first.
        - `inventory_alert`: current stock per product, lowest quantity first.

        Amounts and quantities are returned as decimal strings (for example `"21754.0000"`).
        The first entry of each `business_summary` sales/purchases/collection array is the
        number `0`. Lists are not paginated.

        Super admin users (`role_id = 1`) get `403`.
      operationId: getDashboard

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
              example:
                code: 200
                success: true
                message: Detail data
                data:
                  business_summary:
                    dates: ["2026-11-01", "2026-11-01", "2026-11-02"]
                    totalSales: [0, "7426.7500", "11080.0000"]
                    totalPurchases: [0, "0.0000", "5890.0000"]
                    totalCollection: [0, "10599.2500", "8775.0000"]
                    totalAccountsReceivables: ["486391.5667", "-3240.0000", "2305.0000"]
                    totalAccountsPayables: ["1457499.2185", "0.0000", "5890.0000"]
                  sales_and_collection:
                    dates: [Jan, Feb, Mar]
                    sales: ["477766.5250", "428187.9000", "565990.3000"]
                    collections: ["448329.7500", "493622.0650", "639015.9750"]
                  top_products:
                    - quantity: "322399.850000"
                      total_price: "1184405.850000"
                      sales_id: 1
                      product_id: 10
                      branch_id: 1
                      store_id: 2
                      id: 1
                      company_id: 1
                      product:
                        id: 10
                        name: Test Product A
                  top_customers:
                    - subtotal: "656447.000000"
                      customer_id: 3
                      customerName: Test Customer Ltd
                  recent_transactions:
                    - date: "2026-11-02"
                      quantity: "5.000000"
                      total_price: "6500.000000"
                      product_id: 10
                      type: sale
                      product:
                        id: 10
                        name: Test Product A
                    - date: "2026-11-01"
                      quantity: "10.000000"
                      total_price: "9000.000000"
                      product_id: 11
                      type: purchase
                      product:
                        id: 11
                        name: Test Product B
                  inventory_alert:
                    - quantity: "2.000000"
                      product_id: 11
                      product:
                        id: 11
                        name: Test Product B
                        low_stock: "5.000000"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          description: The user is a super admin (`role_id = 1`). The dashboard is not available for this role yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 403
                success: false
                message: Development ongoing
                errors: null

  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: |
        Paginated list of roles (guard `web`) with each role's permissions as a tree.
        The `superadmin` role is never listed. The roles are in `data.list` and the
        pagination info in `data.meta`.

        Required permission: `module:system-configuration.menu:user-role.permission:view`
      operationId: listRoles

      security:
        - sessionCookie: []

      parameters:
        - name: search
          in: query
          description: Filter by role name (partial match).
          schema:
            type: string
          example: test
        - name: status
          in: query
          description: Filter by status. Any other value is ignored.
          schema:
            type: string
            enum: [Active, Inactive]
        - name: per_page
          in: query
          description: Items per page (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort_by
          in: query
          description: Any other value falls back to `id`.
          schema:
            type: string
            enum: [id, name, status, created_at]
            default: id
        - name: sort_dir
          in: query
          description: Any value other than `asc` sorts descending.
          schema:
            type: string
            enum: [asc, desc]
            default: desc

      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/Role"
                          meta:
                            $ref: "#/components/schemas/PaginationMeta"
              example:
                code: 200
                success: true
                message: List Data
                data:
                  list:
                    - id: 3
                      name: Test Manager
                      status: Active
                      created_at: "2026-11-05T10:15:00.000000Z"
                      permissions:
                        module:
                          system-configuration:
                            menu:
                              user-role:
                                permission: [view, create, edit, change-status]
                              user:
                                permission: [view]
                    - id: 4
                      name: Test Viewer
                      status: Inactive
                      created_at: "2026-11-05T10:20:00.000000Z"
                      permissions:
                        module: {}
                  meta:
                    current_page: 1
                    per_page: 10
                    total: 2
                    last_page: 1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Roles
      summary: Create role
      description: |
        Creates a role (guard `web`) and gives it the listed permissions.

        Required permission: `module:system-configuration.menu:user-role.permission:create`
      operationId: createRole

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"

      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
              example:
                code: 201
                success: true
                message: Role created successfully.
                data:
                  id: 3
                  name: Test Manager
                  status: Active
                  created_at: "2026-11-05T10:15:00.000000Z"
                  permissions:
                    module:
                      system-configuration:
                        menu:
                          user:
                            permission: [view]

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Request validation failed (for example missing, duplicate or `superadmin` name).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              examples:
                missingName:
                  summary: Name missing
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The name field is required. "
                    errors:
                      name:
                        - The name field is required.
                duplicateName:
                  summary: Name already used
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The name has already been taken. "
                    errors:
                      name:
                        - The name has already been taken.

  /roles/{id}:
    put:
      tags:
        - Roles
      summary: Update role
      description: |
        Updates the role's name and status and **replaces** its permissions with the list sent.
        If `permissions` is missing or `[]`, all of the role's permissions are removed, so always
        send the full list. If `status` is missing, the current status is kept.

        Required permission: `module:system-configuration.menu:user-role.permission:edit`
      operationId: updateRole

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/RoleId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"

      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
              example:
                code: 200
                success: true
                message: Role updated successfully.
                data:
                  id: 3
                  name: Test Manager Updated
                  status: Active
                  created_at: "2026-11-05T10:15:00.000000Z"
                  permissions:
                    module:
                      system-configuration:
                        menu:
                          user-role:
                            permission: [view]
                          user:
                            permission: [view]

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/RoleNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ValidationError"

  /roles/{id}/status:
    patch:
      tags:
        - Roles
      summary: Change role status
      description: |
        Sets the role's status to `Active` or `Inactive`. Only the stored value changes;
        users with an `Inactive` role keep their permissions.

        Required permission: `module:system-configuration.menu:user-role.permission:change-status`
      operationId: updateRoleStatus

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/RoleId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Active, Inactive]
                  example: Inactive

      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
              example:
                code: 200
                success: true
                message: Status updated successfully.
                data:
                  id: 3
                  name: Test Manager
                  status: Inactive
                  created_at: "2026-11-05T10:15:00.000000Z"
                  permissions:
                    module: {}

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/RoleNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Status is missing or not `Active` / `Inactive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

  /branches:
    get:
      tags:
        - Branches
      summary: List branches
      description: |
        All branches of the logged-in user's company (super admin: every company). Soft-deleted
        branches are not listed. The list is **not** paginated and has no search or sort
        parameters. No sort order is set (the database usually returns them by ID).

        Required permission: `module:system-configuration.menu:branch.permission:view`
      operationId: listBranches

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Branch"
              example:
                code: 200
                success: true
                message: List Data
                data:
                  - id: 1
                    company_id: 1
                    name: Test Branch Main
                    email: main.branch@example.com
                    phone: "01700000101"
                    address: Test Road 1, Dhaka
                    is_default: "Yes"
                    status: Approved
                    created_at: "2026-11-05T10:15:00.000000Z"
                  - id: 2
                    company_id: 1
                    name: Test Branch Two
                    email: second.branch@example.com
                    phone: "01700000102"
                    address: Test Road 2, Chattogram
                    is_default: "NO"
                    status: Approved
                    created_at: "2026-11-05T10:20:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Branches
      summary: Create branch
      description: |
        Creates a branch for the logged-in user's company. The validation rules are the same
        as the web form (`admin/settings-branch-create`), read from the branch form settings.

        - `status` is always saved as `Approved`, even if another value is sent.
        - `phone` and `email` must be unique across **all** branches (every company, including
          soft-deleted branches).
        - Setting `is_default` to `Yes` does **not** change the old default branch to `NO`;
          update the old one yourself so the company keeps exactly one default branch.

        Required permission: `module:system-configuration.menu:branch.permission:create`
      operationId: createBranch

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"

      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Branch"
              example:
                code: 201
                success: true
                message: Branch created successfully.
                data:
                  id: 3
                  company_id: 1
                  name: Test Branch Three
                  email: third.branch@example.com
                  phone: "01700000103"
                  address: Test Road 3, Sylhet
                  is_default: "NO"
                  status: Approved
                  created_at: "2026-11-08T10:49:30.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/BranchValidationError"

  /branches/{id}:
    put:
      tags:
        - Branches
      summary: Update branch
      description: |
        Updates a branch (API version of the web edit form `admin/settings-branch-edit/{id}`).
        The validation rules are the same as the web form; the branch's own `phone` and `email`
        may be kept.

        **Send the full branch data.** Every field is set from the body, so a missing `email` or
        `address` is saved as `null`.

        - `status` is always saved as `Approved`, so updating an `Inactive` branch makes it active
          again. Use `PATCH /branches/{id}/status` afterwards if needed.
        - `company_id` is set to the logged-in user's company.
        - Setting `is_default` to `Yes` does **not** change the old default branch to `NO`.

        Required permission: `module:system-configuration.menu:branch.permission:edit`
      operationId: updateBranch

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BranchId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"

      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Branch"
              example:
                code: 200
                success: true
                message: Branch updated successfully.
                data:
                  id: 1
                  company_id: 1
                  name: Test Branch Main Updated
                  email: main.branch@example.com
                  phone: "01700000101"
                  address: Test Road 10, Dhaka
                  is_default: "Yes"
                  status: Approved
                  created_at: "2026-11-05T10:15:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BranchNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/BranchValidationError"

    delete:
      tags:
        - Branches
      summary: Delete branch
      description: |
        Soft-deletes a branch (`deleted_at` is set; the row stays in the database).

        The branch cannot be deleted (`409`) when:
        - it is the default branch (`is_default = Yes`), or
        - it is used by any store, stock summary, customer or supplier (`errors.used_in` lists which).

        Other tables (sales, purchases, ledger, …) are not checked.

        Required permission: `module:system-configuration.menu:branch.permission:delete`
      operationId: deleteBranch

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/BranchId"

      responses:
        "200":
          description: Branch deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 3
              example:
                code: 200
                success: true
                message: Branch deleted successfully.
                data:
                  id: 3

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/BranchNotFound"

        "409":
          description: The branch is the default branch or is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                defaultBranch:
                  summary: Default branch
                  value:
                    code: 409
                    success: false
                    message: Default branch cannot be deleted.
                    errors: null
                inUse:
                  summary: Branch in use
                  value:
                    code: 409
                    success: false
                    message: Branch is in use and cannot be deleted.
                    errors:
                      used_in: [stores, stock_summaries, customers]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

