  - name: Stores
    description: Store management (Settings → Store)
  - name: Divisions
    description: Division management (Settings → Division)
  - name: Districts
    description: District management (Settings → District)
  - name: Upazilas
    description: Upazila management (Settings → Upazila)
  - name: Unions
    description: Union management (Settings → Union)
  - name: Employees
    description: Employee management (Settings → Employee)
  - name: Departments
    description: Department management (Settings → Department)
  - name: Customer Groups
    description: Customer group management (Customer Manage → Customer Group)
  - name: Customer Media
    description: Customer media (customer source) management (Customer Manage → Customer Media)
  - name: Customers
    description: Customer management (Customer Manage → Customer)
  - name: Supplier Groups
    description: Supplier group management (Supplier Manage → Supplier Group)
  - name: Suppliers
    description: Supplier management (Supplier Manage → Supplier)
  - name: Units
