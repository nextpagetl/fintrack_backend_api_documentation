      schema:
        type: integer
      example: 1

  schemas:
    SuccessEnvelope:
      type: object
      description: Wrapper used by every successful API response.
      required: [code, success, message, data]
      properties:
        code:
          type: integer
          description: Same as the HTTP status code.
          example: 200
        success:
          type: boolean
          const: true
          example: true
        message:
          type: string
          example: List Data
        data:
          description: Endpoint-specific payload.

    ErrorEnvelope:
      type: object
      description: Wrapper used by errors returned from the API controllers.
      required: [code, success, message, errors]
      properties:
        code:
          type: integer
          description: Same as the HTTP status code.
          example: 404
        success:
          type: boolean
          const: false
          example: false
        message:
          type: string
          example: Not Found
        errors:
          description: Error details; `null`, a string or an object depending on the endpoint.
          type: [object, string, "null"]

    ValidationErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            code:
              example: 422
            message:
              type: string
              description: "`Validation Failed. ` followed by the first message of every invalid field."
              example: "Validation Failed. The name field is required. "
            errors:
              type: object
              description: Field name to list of messages.
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name:
                  - The name field is required.

    FrameworkError:
      type: object
      description: |
        Error written by Laravel or Spatie, not by the API controllers (no envelope).
        With `APP_DEBUG=true` it also has `exception`, `file`, `line` and `trace`.
      properties:
        message:
          type: string
          example: Unauthenticated.

    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

    User:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Test User
        email:
          type: string
          format: email
          example: test.user@example.com
        role_id:
          type: integer
          description: "`1` = super admin, `2` = company admin, others = custom roles."
          example: 3
        role:
          type: [object, "null"]
          description: Spatie role of the user. `null` when no Spatie role is assigned.
          properties:
            name:
              type: string
              example: Test Manager
            permissions:
              $ref: "#/components/schemas/PermissionTree"
        company_id:
          type: [integer, "null"]
          description: "`0` for the super admin."
          example: 1
        status:
          type: string
          example: Approved
        email_verified_at:
          type: [string, "null"]
          format: date-time
          example: null

    Branch:
      type: object
      properties:
        id:
          type: integer
          example: 2
        company_id:
          type: integer
          example: 1
        name:
          type: [string, "null"]
          example: Test Branch Two
        email:
          type: [string, "null"]
          format: email
          example: second.branch@example.com
        phone:
          type: [string, "null"]
          example: "01700000102"
        address:
          type: [string, "null"]
          example: Test Road 2, Chattogram
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "`Yes` = the company's default branch, used when a transaction has no branch."
          example: "NO"
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T10:20:00.000000Z"

    BranchRequest:
      type: object
      description: |
        Body for create and update. Rules come from the branch form settings (same as the web form).
        `status` is not taken from the body; the branch is always saved as `Approved`.
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Test Branch Three
        phone:
          type: string
          description: |
            Bangladeshi phone number (for example `01700000103`, `+8801700000103`).
            Must be unique across all branches.
          example: "01700000103"
        email:
          type: [string, "null"]
          format: email
          description: Must be unique across all branches.
          example: third.branch@example.com
        address:
          type: [string, "null"]
          maxLength: 200
          example: Test Road 3, Sylhet
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "Missing or `null` is saved as `null` (not a default branch)."
          example: "NO"

    Store:
      type: object
      properties:
        id:
          type: integer
          example: 6
        company_id:
          type: integer
          example: 1
        branch_id:
          type: integer
          example: 2
        branch:
          type: [object, "null"]
          description: The store's branch (`null` if the branch was deleted).
          properties:
            id:
              type: integer
              example: 2
            name:
              type: [string, "null"]
              example: Chattogram
        name:
          type: [string, "null"]
          example: Agrabad Store
        email:
          type: [string, "null"]
          format: email
          example: agrabad.store@example.com
        phone:
          type: [string, "null"]
          example: "01711000111"
        address:
          type: [string, "null"]
          example: Agrabad, Chattogram
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: "`Yes` = a default store, used when a transaction has no store."
          example: "NO"
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-09T10:30:00.000000Z"

    StoreRequest:
      type: object
      description: |
        Body for create. Rules come from the store form settings (same as the web form), plus
        the extra API rules listed on `POST /stores`. `status` is not taken from the body; the
        store is always saved as `Approved`.
      required:
        - branch_id
        - name
        - phone
      properties:
        branch_id:
          type: integer
          description: Existing (not soft-deleted) branch.
          example: 2
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Unique within the branch (not case-sensitive).
          example: Agrabad Store
        phone:
          type: string
          description: |
            Bangladeshi phone number (for example `01711000111`, `+8801711000111`).
            Must be unique across all stores (soft-deleted ones included) and must not be the
            phone number of any branch.
          example: "01711000111"
        email:
          type: [string, "null"]
          format: email
          maxLength: 50
          description: Must be unique across all stores (soft-deleted ones included).
          example: agrabad.store@example.com
        address:
          type: [string, "null"]
          maxLength: 200
          example: Agrabad, Chattogram
        is_default:
          type: [string, "null"]
          enum: ["Yes", "NO", null]
          description: |
            Missing or `null` is saved as `null` (not a default store). Setting `Yes` does not
            change other stores' `is_default`.
          example: "NO"

