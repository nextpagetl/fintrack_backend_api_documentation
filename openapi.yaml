        "404":
          $ref: "#/components/responses/DebitNoteReasonNotFound"

        "409":
          description: The reason is still used by debit notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Debit note reason is in use and cannot be deleted.
                errors:
                  used_in: [debit_notes]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

