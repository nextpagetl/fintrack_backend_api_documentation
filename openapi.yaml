      summary: Create pay head config
      description: |
        Creates a payment type (API version of the web form `admin/account-setup-payment-type-create`).

        - `name` is required, 2–55 characters (the size of the database column) and must be
          unique among payment types that are not soft-deleted (not case-sensitive).
        - `account_id` is required: a ledger parent account of the chart of accounts
          (`is_posted = 0`, not soft-deleted), the same list as the web form's **Account** dropdown.
        - `default_account_id` is optional: a posted ledger account (`is_posted = 1`) that is a
          **child of `account_id`**.
        - `status` is always saved as `Approved`, `is_default` stays `NO`, and `company_id` is set
          to the logged-in user's company.

        Required permission: `module:accounts-setup.menu:pay-head-config.permission:create`
