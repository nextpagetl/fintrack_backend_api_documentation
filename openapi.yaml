                value:
                  status: Inactive

      responses:
        "200":
          description: Non-inventory updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NonInventory"
              example:
                code: 200
                success: true
