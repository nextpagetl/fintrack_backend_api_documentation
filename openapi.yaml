        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:02:08.000000Z"

    UnionRequest:
      type: object
      description: |
        Union fields. Rules come from the union form settings (same as the web form), plus an
        existing upazila and a name unique within the upazila. `upazila_id` and `name` are
        required on create; on update every field is optional (see the endpoint).
      properties:
        upazila_id:
