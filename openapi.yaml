        - When any location field (`division_id`, `district_id`, `upazila_id`, `union_id`) is
          sent, the resulting location — sent values, or the current ones — must fit together.
          For example, changing only `division_id` fails when the current district is not of the
          new division; send the new `district_id` (and lower levels) too, or empty them.
        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`;
          cannot be empty); otherwise the current status is kept.
        - `company_id` is set to the logged-in user's company (the customer is already of that
          company).

        Required permission: `module:customer-manage.menu:customer.permission:edit`
      operationId: updateCustomer

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CustomerId"

