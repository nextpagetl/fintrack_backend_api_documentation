              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          path:
                            type: string
                            description: Send this in `images` when saving the product.
                          url:
                            type: string
                            description: Public URL of the uploaded image, for the preview.
              example:
                code: 201
                success: true
                message: Image uploaded successfully.
                data:
                  path: public/uploads/product/tmp/2/4232e041-69da-4b1c-8cc5-672cf87969bc.png
                  url: https://backend-fintrack360.eduguard360.com/storage/uploads/product/tmp/2/4232e041-69da-4b1c-8cc5-672cf87969bc.png

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: No file, not an image, wrong type or larger than 5 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              examples:
                missing:
                  summary: No file sent
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The image field is required. "
                    errors:
                      image:
                        - The image field is required.
                wrongType:
                  summary: Not a jpg / jpeg / png / webp image
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The image must be an image. "
                    errors:
                      image:
                        - The image must be an image.
                        - "The image must be a file of type: jpg, jpeg, png, webp."
                tooLarge:
                  summary: Larger than 5 MB
                  value:
                    code: 422
                    success: false
                    message: "Validation Failed. The image must not be greater than 5120 kilobytes. "
                    errors:
                      image:
                        - The image must not be greater than 5120 kilobytes.

  /products/{id}:
    put:
      tags:
        - Products
      summary: Update product
      description: |
        Updates a product (API version of the web edit form `admin/inventory-setup-product-edit/{id}`).
        This is a **partial update**. If validation fails, nothing is saved.

        - A field that is **not sent** keeps its current value.
        - A field sent **empty** (`""` or `null`) is saved as `null`. `name` and `unit_id` are
          required, so sending them empty returns `422`.
        - Sent fields use the same rules as create; the product's own name and code may be kept.
        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`;
          cannot be empty); otherwise the current status is kept.
        - `images`:
          - not sent — the images are kept;
          - sent — the product's images become exactly this list: paths of current images are
            kept, new paths from `POST /products/images` are moved to the product, and current
            images not in the list are **hard-deleted** together with their files;
          - `[]` — all images are removed and `image` becomes `null`.

          `image` is always the **last** image of the list.
        - As in the web form, `type_id` is set to `Pos Product` and `company_id` to the logged-in
          user's company (the product is already of that company).

        Required permission: `module:product-manage.menu:product.permission:edit`
      operationId: updateProduct

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ProductId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
            examples:
              priceOnly:
                summary: Change only the sale price (everything else is kept)
                value:
                  sale_price: 2.75
              clearDescription:
                summary: Remove the description and code
                value:
                  description: ""
                  code: ""
              statusOnly:
                summary: Change only the status
                value:
                  status: Inactive
              replaceImages:
                summary: Keep one current image, add a new upload, remove the others
                value:
                  images:
                    - public/uploads/product/223/4232e041-69da-4b1c-8cc5-672cf87969bc.png
                    - public/uploads/product/tmp/2/9296ab32-5ae0-441e-8c83-f037456653ed.png
              removeAllImages:
                summary: Remove all images
                value:
                  images: []

      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
              example:
                code: 200
                success: true
                message: Product updated successfully.
                data:
                  id: 1
                  company_id: 1
                  code: null
                  name: Silicone Softener WM-80
                  category_id: 7
                  category_name: Silicone
                  brand_id: 1
                  brand_name: Brand1
                  unit_id: 1
                  unit_name: KG
                  product_type_id: 3
                  product_type_name: Raw Material & Finished Good
                  purchases_price: "1.810000"
                  sale_price: "2.750000"
                  sd_rate: null
                  vat_rate: null
                  low_stock: "100.000000"
                  description: null
                  image: null
                  image_url: null
                  images: []
                  status: Approved
                  created_at: "2025-01-18T10:14:49.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ProductValidationError"

        "500":
          $ref: "#/components/responses/ProductSaveFailed"

    delete:
      tags:
        - Products
      summary: Delete product
      description: |
        Soft-deletes a product (`deleted_at` is set; the row stays in the database). A deleted
        product is no longer listed and returns `404` on every other endpoint. Its details and
        attributes are deleted as in the web delete, and its **images are hard-deleted together
        with their files**.

        The product cannot be deleted (`409`) when it is still used; `errors.used_in` lists the
        tables (soft-deleted rows are not counted): purchase, purchase order, requisition, MRR,
        purchase return, sales, sales return, sales loan, sales loan return, quotation, delivery
        challan, POS, invoice, booking, stock, stock summary, transfer, inventory adjustment,
        inventory opening, BOM, WIP and LC lines. (The web list only hides the delete button for
        products used by purchases, purchase orders or requisitions.)

        Required permission: `module:product-manage.menu:product.permission:delete`
      operationId: deleteProduct

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ProductId"

      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 223
              example:
                code: 200
                success: true
                message: Product deleted successfully.
                data:
                  id: 223

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductNotFound"

        "409":
          description: The product is still used by transaction or stock lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Product is in use and cannot be deleted.
                errors:
                  used_in: [purchases_details, sales_details, stocks, stock_summaries]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "500":
          description: The product could not be deleted; nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 500
                success: false
                message: Product could not be deleted.
                errors: Server Error

