                  id: 6
                  company_id: 1
                  branch_id: 2
                  branch:
                    id: 2
                    name: Chattogram
                  name: Agrabad Store
                  email: agrabad.store@example.com
                  phone: "01711000111"
                  address: Agrabad Commercial Area
                  is_default: "NO"
                  status: Approved
                  created_at: "2026-11-09T10:30:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/StoreNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/StoreValidationError"

    delete:
      tags:
        - Stores
      summary: Delete store
      description: |
        Soft-deletes a store (`deleted_at` is set; the row stays in the database). A deleted
        store is no longer listed and returns `404` on every other endpoint.

        The store cannot be deleted (`409`) when:
