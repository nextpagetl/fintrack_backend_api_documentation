  /chart-of-accounts/{id}:
    put:
      tags:
        - Chart of Accounts
      summary: Update account
      description: |
        Updates an account (API version of the web edit form
        `admin/account-setup-chartOfAccount-edit/{id}`). This works **exactly like the web edit
        form** — it is not a partial update. If validation fails, nothing is saved.

        - `name` and `group_id` are required; `parent_id`, `is_posted` and `branch_id` use the
          same rules as create.
        - The parent and account type are set again from `parent_id` (or `group_id`).
        - `account_code` is generated again from the parent's code **on every update**, even when
          only the name changes, so it can change and can be the same as another account's code.
        - `is_posted` is set to 1 only when sent as `true` / `1` / `"on"`; **not sending it saves
          0** (a ledger becomes a parent account).
        - `branch_id` is saved as sent (`null` when not sent).
        - `status` is always set to `Approved`; use `PATCH /chart-of-accounts/{id}/status` to
          change it.
        - `company_id` is set to the logged-in user's company.

        Required permission: `module:accounts-setup.menu:account.permission:edit`
      operationId: updateChartOfAccount

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ChartOfAccountId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ChartOfAccountRequest"
                - type: object
                  required:
                    - name
                    - group_id
            example:
              name: Test Ledger 2
              group_id: 2
              parent_id: 29
              is_posted: true

      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChartOfAccount"
              example:
                code: 200
                success: true
                message: Account updated successfully.
                data:
                  id: 30
                  account_code: AC000001291
                  name: Test Ledger 2
                  account_type:
                    id: 1
                    name: Assets
                  group:
                    id: 2
                    name: Test Group
                  parent:
                    id: 29
                    name: Test Parent Account
                  level: 3
                  is_posted: 1
                  branch_id: null
                  company_id: 1
                  status: Approved
                  created_at: "2026-11-11T09:41:23.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ChartOfAccountNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ChartOfAccountValidationError"

    delete:
      tags:
        - Chart of Accounts
      summary: Delete account
      description: |
        Soft-deletes an account (`deleted_at` is set; the row stays in the database). A deleted
        account is no longer listed and returns `404` on every other endpoint.

        The account cannot be deleted (`409`) when it is still used (soft-deleted rows are not
        counted); `errors.used_in` lists where:

        - `chart_of_accounts` — it has child accounts;
        - ledgers and vouchers — `general_ledgers`, `opening_balances`, `journal_voucher_ledgers`,
          `payment_voucher_ledgers`, `receive_voucher_ledgers`, `contra_voucher_details`,
          `payment_vouchers`, `receive_vouchers`;
        - settings — `payment_types` (`account_id`, `payment_types.default_account_id`), `banks`,
          `general_setups.deposit_account_id`, `report_models`;
        - other documents holding `account_id` — sale payments, purchases, sales, POS, bookings,
          inventory adjustments, debit / credit notes, service documents, BOM / WIP cost lines.

        The web deletes without this check; the API blocks the delete on the server.

        Required permission: `module:accounts-setup.menu:account.permission:delete`
      operationId: deleteChartOfAccount

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ChartOfAccountId"

      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 30
              example:
                code: 200
                success: true
                message: Account deleted successfully.
                data:
                  id: 30

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ChartOfAccountNotFound"

        "409":
          description: The account has child accounts or is still used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Account is in use and cannot be deleted.
                errors:
                  used_in: [general_ledgers, opening_balances, journal_voucher_ledgers]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

