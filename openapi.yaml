          maxLength: 100
          description: Unique across divisions (not case-sensitive; soft-deleted ones not counted).
          example: Test Division
        bn_name:
          type: [string, "null"]
          maxLength: 100
          example: টেস্ট
        url:
          type: [string, "null"]
          format: uri
          maxLength: 255
