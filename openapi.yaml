                  description: LPG
                  status: Inactive
                  created_at: "2026-11-11T03:59:39.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NonInventoryNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/NonInventoryValidationError"

    delete:
      tags:
