      operationId: updateNonInventory

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/NonInventoryId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields are optional; send only what should change.
              properties:
                name:
                  $ref: "#/components/schemas/NonInventoryName"
                price:
                  $ref: "#/components/schemas/NonInventoryPrice"
                description:
                  $ref: "#/components/schemas/NonInventoryDescription"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Inactive
            examples:
