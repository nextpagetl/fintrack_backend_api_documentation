        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductCategoryNotFound"

        "409":
          description: The product category is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Product category is in use and cannot be deleted.
                errors:
                  used_in: [products, stock_summaries, child_categories]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

