  /suppliers/{id}:
    put:
      tags:
        - Suppliers
      summary: Update supplier
      description: |
        Updates a supplier (API version of the web edit form `admin/inventory-setup-supplier-edit/{id}`).
        This is a **partial update**:

        - A field that is **not sent** keeps its current value.
        - A field sent **empty** (`""` or `null`) is saved as `null`. `name`, `supplier_type` and
          `phone` are required, so sending them empty returns `422`.
        - Sent fields use the same rules as create; the supplier's own email may be kept. `code`
          can be changed here (as in the web edit form).
        - When any location field (`division_id`, `district_id`, `upazila_id`, `union_id`) is
          sent, the resulting location — sent values, or the current ones — must fit together.
          For example, changing only `division_id` fails when the current district is not of the
          new division.
        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`;
          cannot be empty); otherwise the current status is kept.
        - `company_id` is set to the logged-in user's company (the supplier is already of that
          company).

        Required permission: `module:supplier-manage.menu:supplier.permission:edit`
      operationId: updateSupplier

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/SupplierId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SupplierRequest"
                - type: object
                  properties:
                    code:
                      type: [string, "null"]
                      maxLength: 255
                      description: Update only; saved as sent.
                      example: SUP-0001
            examples:
              addressOnly:
                summary: Change only the address
                value:
                  address: Test Road 9, Test City
              moveLocation:
                summary: Move to another location (whole chain)
                value:
                  division_id: 2
                  district_id: 3
                  upazila_id: 4
                  union_id: 5
              statusOnly:
                summary: Change only the status
                value:
                  status: Inactive

      responses:
        "200":
          description: Supplier updated. `data` is the supplier (see `Supplier`) after the update.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Supplier"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/SupplierNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/SupplierValidationError"

    delete:
      tags:
        - Suppliers
      summary: Delete supplier
      description: |
        Soft-deletes a supplier (`deleted_at` is set; the row stays in the database). A deleted
        supplier is no longer listed, returns `404` on every other endpoint, and its email can be
        used again.

        The supplier cannot be deleted (`409`) when any of these tables still uses it
        (`supplier_id`; soft-deleted rows are not counted); `errors.used_in` lists which:
        `purchases`, `purchases_orders`, `purchases_payments`, `purchases_payment_details`,
        `purchases_pending_cheques`, `purchases_returns`, `payment_vouchers`, `receive_vouchers`,
        `contra_vouchers`, `journal_vouchers`, `debit_notes`, `credit_notes`, `lcs`,
        `supplier_opening_details`. (The web list only hides the delete button for suppliers with
        purchases.)

        Required permission: `module:supplier-manage.menu:supplier.permission:delete`
      operationId: deleteSupplier

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/SupplierId"

      responses:
        "200":
          description: Supplier deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 75
              example:
                code: 200
                success: true
                message: Supplier deleted successfully.
                data:
                  id: 75

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/SupplierNotFound"

        "409":
          description: The supplier is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Supplier is in use and cannot be deleted.
                errors:
                  used_in: [purchases, purchases_payments, payment_vouchers]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

  /suppliers/{id}/status:
    patch:
