        Updates a product type's name and status (API version of the web edit form
        `admin/inventory-setup-product-type-edit/{id}`). The validation rules are the same as the web form,
        plus a unique name check and a required status.

        - `name` must be unique within the logged-in user's company (not case-sensitive); the
          product type's own name may be kept.
        - `status` is taken from the body (`Approved`, `Inactive`, `Pending` or `Cancel`).
        - `company_id` is set to the logged-in user's company.

        Required permission: `module:product-manage.menu:product-type.permission:edit`
      operationId: updateProductType

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ProductTypeId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - status
              properties:
                name:
                  $ref: "#/components/schemas/ProductTypeName"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Inactive

      responses:
        "200":
          description: Product type updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProductType"
              example:
                code: 200
                success: true
                message: Product type updated successfully.
                data:
                  id: 1
                  company_id: 1
                  name: Semi Finished Good
                  status: Inactive
                  created_at: "2026-11-09T10:15:00.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductTypeNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ProductTypeValidationError"

    delete:
      tags:
        - Product Types
      summary: Delete product type
      description: |
        Soft-deletes a product type (`deleted_at` is set; the row stays in the database). A deleted
        product type is no longer listed, returns `404` on every other endpoint, and its name can be
        used again.

        The product type cannot be deleted (`409`) when it is used by any of the products
        (`products.product_type_id`; soft-deleted products are not counted). The web list uses the same check
        to hide the delete button; the API blocks the delete on the server.

        Required permission: `module:product-manage.menu:product-type.permission:delete`
      operationId: deleteProductType

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ProductTypeId"

      responses:
        "200":
          description: Product type deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 3
              example:
                code: 200
                success: true
                message: Product type deleted successfully.
                data:
                  id: 3

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductTypeNotFound"

        "409":
          description: The product type is still in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Product type is in use and cannot be deleted.
                errors:
                  used_in: [products]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

