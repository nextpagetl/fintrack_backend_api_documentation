  /inventory-adjustment-reasons/{id}:
    put:
      tags:
        - Inventory Adjustment Reasons
      summary: Update inventory adjustment reason
      description: |
        Updates an inventory adjustment reason (API version of the web edit form
        `admin/account-setup-inventory-adjustment-reason-edit/{id}`). This is a **partial update**:
        every field is optional, and a field that is not sent keeps its current value.

        - `name`, `debit_id`, `credit_id` and `adjustment_type` use the same rules as create; the
          reason's own name may be kept. The "debit and credit must be different" check runs only
          when one of the two accounts is sent.
        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`).
        - Inventory adjustments store the reason **ID**, so a used reason can be renamed. Changing
          its accounts affects only adjustments posted afterwards.
        - `company_id` is set to the logged-in user's company (same as the web form).

        Note: the web edit form never saves (its repository writes a `type` column that the table
        does not have); this endpoint saves the fields above directly and works.

        Required permission: `module:accounts-setup.menu:inventory-adjustment-reason.permission:edit`
      operationId: updateInventoryAdjustmentReason

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/InventoryAdjustmentReasonId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields are optional; send only what should change.
              properties:
                name:
                  $ref: "#/components/schemas/InventoryAdjustmentReasonName"
                debit_id:
                  $ref: "#/components/schemas/InventoryAdjustmentReasonAccountId"
                credit_id:
                  $ref: "#/components/schemas/InventoryAdjustmentReasonAccountId"
                adjustment_type:
                  $ref: "#/components/schemas/InventoryAdjustmentType"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Pending
            examples:
              nameOnly:
                summary: Rename only
                value:
                  name: Goods Damage (Warehouse)
              typeAndStatus:
                summary: Change the adjustment type and status
                value:
                  adjustment_type: Out
                  status: Pending

      responses:
        "200":
          description: Inventory adjustment reason updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/InventoryAdjustmentReason"
              example:
                code: 200
                success: true
                message: Inventory adjustment reason updated successfully.
                data:
                  id: 5
                  company_id: 1
                  name: Stock Found
                  debit_id: 9
                  credit_id: 206
                  adjustment_type: Out
                  status: Pending
                  created_at: "2026-11-10T09:52:09.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/InventoryAdjustmentReasonNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/InventoryAdjustmentReasonValidationError"

        "500":
          $ref: "#/components/responses/InventoryAdjustmentReasonSaveFailed"

    delete:
      tags:
        - Inventory Adjustment Reasons
      summary: Delete inventory adjustment reason
      description: |
        Soft-deletes an inventory adjustment reason (`deleted_at` is set; the row stays in the
        database). A deleted reason is no longer listed, returns `404` on every other endpoint, and
        its name can be used again.

        The reason cannot be deleted (`409`) when any inventory adjustment uses it
        (`inventory_adjustments.reason`; soft-deleted adjustments are not counted). The web list
        never shows a delete button for reasons; the API allows deleting unused ones.

        Required permission: `module:accounts-setup.menu:inventory-adjustment-reason.permission:delete`
      operationId: deleteInventoryAdjustmentReason

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/InventoryAdjustmentReasonId"

      responses:
        "200":
          description: Inventory adjustment reason deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
              example:
                code: 200
                success: true
                message: Inventory adjustment reason deleted successfully.
                data:
                  id: 5

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/InventoryAdjustmentReasonNotFound"

        "409":
          description: The reason is still used by inventory adjustments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Inventory adjustment reason is in use and cannot be deleted.
                errors:
                  used_in: [inventory_adjustments]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

