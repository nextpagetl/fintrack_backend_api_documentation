                data:
                  id: 8
                  company_id: 1
                  name: Nagad
                  account_id: 57
                  default_account_id: 58
                  note: test
                  status: Approved
                  is_default: "NO"
                  created_at: "2026-11-10T09:10:39.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/PayHeadConfigValidationError"

  /pay-head-configs/{id}:
    put:
      tags:
        - Pay Head Config
      summary: Update pay head config
      description: |
        Updates a payment type (API version of the web edit form
        `admin/account-setup-payment-type-edit/{id}`). This is a **partial update**: every field is
        optional, and a field that is not sent keeps its current value.

        - `name` uses the same rules as create; the payment type's own name may be kept.
          Because transactions store the payment type name, the name **cannot be changed**
          (`422`) when the payment type is a default one (`is_default = Yes`: Cash, Credit, Bank)
          or when any transaction uses it.
        - `account_id` / `default_account_id` use the same rules as create. The "default account
          must be a child of the account" check runs only when one of the two is sent, so other
          fields of an existing record can be edited even if its saved pair does not follow the
          rule. Send `default_account_id: null` to clear it.
        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`).
        - `company_id` is set to the logged-in user's company (same as the web form).

        Required permission: `module:accounts-setup.menu:pay-head-config.permission:edit`
      operationId: updatePayHeadConfig

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/PayHeadConfigId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields are optional; send only what should change.
              properties:
                name:
                  $ref: "#/components/schemas/PayHeadConfigName"
                account_id:
                  $ref: "#/components/schemas/PayHeadConfigAccountId"
                default_account_id:
                  $ref: "#/components/schemas/PayHeadConfigDefaultAccountId"
                note:
                  $ref: "#/components/schemas/PayHeadConfigNote"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Pending
            examples:
              noteOnly:
                summary: Change only the note
                value:
                  note: BKash or Nagad
              clearDefaultAccount:
                summary: Remove the default account
                value:
                  default_account_id: null
              accounts:
                summary: Change both accounts
                value:
                  account_id: 57
                  default_account_id: 58

      responses:
        "200":
          description: Pay head config updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PayHeadConfig"
              example:
                code: 200
                success: true
                message: Pay head config updated successfully.
                data:
                  id: 4
                  company_id: 1
                  name: Mobile Banking
                  account_id: 57
                  default_account_id: 58
                  note: BKash or Nagad
                  status: Approved
                  is_default: "NO"
                  created_at: "2025-01-19T09:37:54.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/PayHeadConfigNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/PayHeadConfigValidationError"

    delete:
      tags:
        - Pay Head Config
      summary: Delete pay head config
      description: |
        Soft-deletes a payment type (`deleted_at` is set; the row stays in the database). A
        deleted payment type is no longer listed in the API, the web list or the sales / purchase
        form dropdowns, returns `404` on every other endpoint, and its name can be used again.

        The payment type cannot be deleted (`409`) when:

        - it is a default one (`is_default = Yes`: Cash, Credit, Bank), or
        - any transaction stores its name (`errors.used_in` lists the tables). Checked tables:
          `sales`, `sale_payments`, `sale_payment_details`, `sale_returns`,
          `sale_return_wihout_refs`, `purchases`, `purchases_payments`,
          `purchases_payment_details`, `purchases_returns`, `purchases_mrrs`, `pos`, `inovices`,
          `bookings`, `service_invoices`, `service_payments`, `sale_commission_payments`
          (soft-deleted rows are not counted).

        The web list only hides the delete button for default payment types; the API also
        blocks used ones.

        Required permission: `module:accounts-setup.menu:pay-head-config.permission:delete`
      operationId: deletePayHeadConfig

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/PayHeadConfigId"

      responses:
        "200":
          description: Pay head config deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 8
              example:
                code: 200
                success: true
                message: Pay head config deleted successfully.
                data:
                  id: 8

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/PayHeadConfigNotFound"

        "409":
          description: The payment type is a default one or is used by transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                defaultType:
                  summary: Default payment type
                  value:
                    code: 409
                    success: false
                    message: A default pay head config cannot be deleted.
                    errors:
                      is_default: "Yes"
                inUse:
                  summary: Used by transactions
                  value:
                    code: 409
                    success: false
                    message: Pay head config is in use and cannot be deleted.
                    errors:
                      used_in: [sale_payments, sale_payment_details]

        "419":
          $ref: "#/components/responses/CsrfMismatch"

