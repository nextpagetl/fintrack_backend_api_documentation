      summary: Update store
      description: |
        Updates a store (API version of the web edit form `admin/settings-store-edit/{id}`).
        This is a **partial update**: only the fields in the body are validated and changed;
        every field that is not sent keeps its current value. Sending a nullable field as
        `null` (for example `"email": null`) clears it.

        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`);
          otherwise the store keeps its current status.
        - `name` must be unique within the branch the store ends up in (the new `branch_id`
          if sent, otherwise the current branch). Moving a store to another branch without a
          new name checks the current name in the new branch.
        - Unique checks on `phone`, `email` and `name` ignore this store.
        - `company_id` is set to the logged-in user's company.

        Required permission: `module:system-configuration.menu:store.permission:edit`
      operationId: updateStore

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/StoreId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields are optional; send only what should change.
              properties:
                branch_id:
                  type: integer
                  description: Existing (not soft-deleted) branch.
                  example: 2
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Agrabad Store
                phone:
                  type: string
                  description: Bangladeshi phone number; unique across all stores.
                  example: "01711000111"
                email:
                  type: [string, "null"]
                  format: email
                  maxLength: 50
                  example: agrabad.store@example.com
                address:
                  type: [string, "null"]
                  maxLength: 200
                  example: Agrabad, Chattogram
                is_default:
                  type: [string, "null"]
                  enum: ["Yes", "NO", null]
                  example: "NO"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Inactive
            examples:
              addressOnly:
                summary: Change only the address
                value:
                  address: Agrabad Commercial Area
              nameAndStatus:
                summary: Rename and change status
                value:
                  name: Agrabad Store 2
                  status: Pending
              clearEmail:
                summary: Clear the email
                value:
                  email: null

      responses:
