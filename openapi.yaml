        "500":
          $ref: "#/components/responses/DebitNoteReasonSaveFailed"

    delete:
      tags:
        - Debit Note Reasons
      summary: Delete debit note reason
      description: |
        Soft-deletes a debit note reason (`deleted_at` is set; the row stays in the database). A
        deleted reason is no longer listed, returns `404` on every other endpoint, and its name
