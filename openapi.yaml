openapi: 3.1.0

info:
  title: FinTrack360 Backend API
  version: 1.0.0
  description: |
    FinTrack360 Backend REST API Documentation.

    This specification documents the routes defined in `routes/api.php`.

    ## Authentication
    The API uses **Laravel Sanctum SPA (session cookie) authentication**, not bearer tokens.

    1. Call `GET /csrf-token` to start a session and get a CSRF token.
    2. Call `POST /login` with the `X-CSRF-TOKEN` header. On success the session cookie
       is authenticated and a new `csrf_token` is returned.
    3. Send the session cookie and the latest `X-CSRF-TOKEN` with every following
       `POST`, `PUT` and `PATCH` request (for example `POST /logout`, `PUT /roles/{id}`).

    ## Permissions
    Role endpoints also need a Spatie permission, named
    `module:<module>.menu:<menu>.permission:<action>`. The required permission is listed in
    each endpoint's description; without it the API returns `403`. The `superadmin` role
    passes every permission check.

    The client origin must be listed in `SANCTUM_STATEFUL_DOMAINS`, otherwise the
    session endpoints return `400`. Browser clients must send requests with credentials
    (`withCredentials: true` / `credentials: "include"`).

  contact:
    name: FinTrack360 API Support

servers:
  - url: https://backend-fintrack360.eduguard360.com/api
    description: Demo server

tags:
  - name: Authentication
    description: Session-based login and logout (Sanctum SPA)
  - name: User
    description: The currently logged-in user
  - name: Dashboard
    description: Company dashboard data
  - name: Roles
    description: User role management (Spatie permission)

paths:
  /csrf-token:
    get:
      tags:
        - Authentication
      summary: Get CSRF token
      description: |
        Starts a session and returns a CSRF token. Cross-origin SPA clients use this
        because they cannot read the `XSRF-TOKEN` cookie. Send the token in the
        `X-CSRF-TOKEN` header on `POST /login` and `POST /logout`.
      operationId: getCsrfToken

      responses:
        "200":
          description: CSRF token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"

        "400":
          $ref: "#/components/responses/SessionUnavailable"

  /login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticates the user with the web session guard. Only users with
        status `Approved` can log in. Limited to 5 requests per minute.
      operationId: login

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: secret123
                remember:
                  type: boolean
                  description: Keep the user logged in ("remember me").
                  default: false
                  example: false

      responses:
        "200":
          description: Login successful. The session is now authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful.
                  csrf_token:
                    type: string
                    description: New CSRF token to use for the following requests.
                    example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "400":
          $ref: "#/components/responses/SessionUnavailable"

        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid email or password.

        "403":
          description: The account exists but its status is not `Approved`
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Your account is not active.
                  csrf_token:
                    type: string
                    example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ValidationError"

        "429":
          $ref: "#/components/responses/TooManyRequests"

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logs the user out, invalidates the session and returns a new CSRF token.
      operationId: logout

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.
                  csrf_token:
                    type: string
                    example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

        "401":
          $ref: "#/components/responses/Unauthorized"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

  /me:
    get:
      tags:
        - User
      summary: Get current user
      description: |
        Returns the details of the logged-in user, with the user's Spatie role and its
        permissions grouped as a tree (see `PermissionTree`). `role` is `null` when the
        user has no role assigned.
      operationId: getCurrentUser

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"

        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard data
      description: |
        Returns all dashboard sections for the logged-in user's company in one response.

        - `business_summary`: day-by-day totals from the 1st of the current month to today.
        - `sales_and_collection`: month-by-month totals for the current year (Jan–Dec).
        - `top_products`: products by total sales amount, all time, highest first.
        - `top_customers`: customers by total sales subtotal, highest first.
        - `recent_transactions`: up to 15 purchase lines and 15 sale lines, newest date first.
        - `inventory_alert`: current stock per product, lowest quantity first.

        Amounts and quantities are returned as decimal strings (for example `"21754.0000"`).
        Lists are not paginated.

        Super admin users (`role_id = 1`) get `403`.
      operationId: getDashboard

      security:
        - sessionCookie: []

      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          description: The user is a super admin (`role_id = 1`). The dashboard is not available for this role yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Development ongoing

  /roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: |
        Paginated list of roles (guard `web`) with each role's permissions as a tree.
        The `superadmin` role is never listed.

        Required permission: `module:system-configuration.menu:user-role.permission:view`
      operationId: listRoles

      security:
        - sessionCookie: []

      parameters:
        - name: search
          in: query
          description: Filter by role name (partial match).
          schema:
            type: string
          example: acc
        - name: status
          in: query
          description: Filter by status. Any other value is ignored.
          schema:
            type: string
            enum: [Active, Inactive]
        - name: per_page
          in: query
          description: Items per page (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort_by
          in: query
          description: Any other value falls back to `id`.
          schema:
            type: string
            enum: [id, name, status, created_at]
            default: id
        - name: sort_dir
          in: query
          description: Any value other than `asc` sorts descending.
          schema:
            type: string
            enum: [asc, desc]
            default: desc

      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Roles
      summary: Create role
      description: |
        Creates a role (guard `web`) and gives it the listed permissions.

        Required permission: `module:system-configuration.menu:user-role.permission:create`
      operationId: createRole

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"

      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role created successfully.
                  data:
                    $ref: "#/components/schemas/Role"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ValidationError"

  /roles/{id}:
    put:
      tags:
        - Roles
      summary: Update role
      description: |
        Updates the role's name and status and **replaces** its permissions with the list sent.
        If `permissions` is missing or `[]`, all of the role's permissions are removed, so always
        send the full list. If `status` is missing, the current status is kept.

        Required permission: `module:system-configuration.menu:user-role.permission:edit`
      operationId: updateRole

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/RoleId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"

      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role updated successfully.
                  data:
                    $ref: "#/components/schemas/Role"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/RoleNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ValidationError"

  /roles/{id}/status:
    patch:
      tags:
        - Roles
      summary: Change role status
      description: |
        Sets the role's status to `Active` or `Inactive`. Only the stored value changes;
        users with an `Inactive` role keep their permissions.

        Required permission: `module:system-configuration.menu:user-role.permission:change-status`
      operationId: updateRoleStatus

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/RoleId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Active, Inactive]
                  example: Inactive

      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Status updated successfully.
                  data:
                    $ref: "#/components/schemas/Role"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/RoleNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel session cookie set by `GET /csrf-token` and authenticated by `POST /login`.
        The actual cookie name comes from `SESSION_COOKIE` (default: the app name + `_session`).

  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token from `GET /csrf-token` or from the last login/logout response.
      schema:
        type: string

    RoleId:
      name: id
      in: path
      required: true
      description: Role ID. The `superadmin` role, an unknown ID or a non-numeric ID returns `404`.
      schema:
        type: integer
      example: 2

  schemas:
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          example: kT3s9QwXv2mL8pR1aZ7cN4yB6hJ0dF5eG2uI9oP1

    Error:
      type: object
      properties:
        message:
          type: string
          example: The request could not be processed.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Admin
        email:
          type: string
          format: email
          example: admin@example.com
        role_id:
          type: integer
          description: "`1` = super admin, `2` = company admin."
          example: 2
        role:
          type: [object, "null"]
          description: Spatie role of the user. `null` when no role is assigned.
          properties:
            name:
              type: string
              example: admin
            permissions:
              $ref: "#/components/schemas/PermissionTree"
        company_id:
          type: [integer, "null"]
          example: 1
        status:
          type: string
          example: Approved
        email_verified_at:
          type: [string, "null"]
          format: date-time
          example: null

    Decimal:
      type: [string, number]
      description: Decimal value. Usually a string such as `"21754.0000"`; can be the number `0`.
      example: "21754.0000"

    ProductRef:
      type: [object, "null"]
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: Softener RT

    Dashboard:
      type: object
      properties:
        business_summary:
          $ref: "#/components/schemas/BusinessSummary"
        sales_and_collection:
          $ref: "#/components/schemas/SalesAndCollection"
        top_products:
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        top_customers:
          type: array
          items:
            $ref: "#/components/schemas/TopCustomer"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/RecentTransaction"
        inventory_alert:
          type: array
          items:
            $ref: "#/components/schemas/InventoryAlert"

    BusinessSummary:
      type: object
      description: |
        Parallel arrays, one entry per day of the current month up to today. Index `0` is an
        opening entry dated the 1st of the month: its sales, purchases and collection are `0`,
        and its receivables/payables hold the opening balance. The other entries are that day's
        total (receivables/payables: that day's net change). The sum of each array is the
        month's total (receivables/payables: today's closing balance).
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
          example: ["2026-10-01", "2026-10-01", "2026-10-02"]
        totalSales:
          description: General sales + POS sales (`grand_total`).
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "21754.0000", "18200.0000"]
        totalPurchases:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "3900.0000", "0.0000"]
        totalCollection:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: [0, "24188.0000", "9500.0000"]
        totalAccountsReceivables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["468649.0165", "2066.0000", "-1200.0000"]
        totalAccountsPayables:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["1531863.4825", "3900.0000", "0.0000"]

    SalesAndCollection:
      type: object
      description: Parallel arrays with 12 entries, one per month of the current year.
      properties:
        dates:
          type: array
          items:
            type: string
          example: ["Jan", "Feb", "Mar"]
        sales:
          description: General sales + POS sales for the month.
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["477766.5250", "428187.9000", "0.0000"]
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Decimal"
          example: ["448329.7500", "493622.0650", "0.0000"]

    TopProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 10
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        sales_id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        branch_id:
          type: [integer, "null"]
          example: 1
        store_id:
          type: [integer, "null"]
          example: 2
        id:
          type: integer
          description: Taken from one arbitrary sale line of the product; not meaningful.
          example: 1
        company_id:
          type: integer
          example: 1
        product:
          $ref: "#/components/schemas/ProductRef"
      example:
        quantity: "312818.850000"
        total_price: "1149449.850000"
        sales_id: 1
        product_id: 10
        branch_id: 1
        store_id: 2
        id: 1
        company_id: 1
        product:
          id: 10
          name: Softener RT

    TopCustomer:
      type: object
      properties:
        subtotal:
          $ref: "#/components/schemas/Decimal"
        customer_id:
          type: [integer, "null"]
          example: 1535
        customerName:
          type: [string, "null"]
          example: Global Trading Service Ltd
      example:
        subtotal: "656447.000000"
        customer_id: 1535
        customerName: Global Trading Service Ltd

    RecentTransaction:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2025-01-05"
        type:
          type: string
          enum: [purchase, sale]
          example: purchase
        product_id:
          type: integer
          example: 12
        quantity:
          $ref: "#/components/schemas/Decimal"
        total_price:
          $ref: "#/components/schemas/Decimal"
        product:
          $ref: "#/components/schemas/ProductRef"
      example:
        date: "2025-01-05"
        quantity: "550.000000"
        total_price: "1006.500000"
        product_id: 12
        type: purchase
        product:
          id: 12
          name: Fixing Agent DFA-600

    InventoryAlert:
      type: object
      properties:
        product_id:
          type: integer
          example: 79
        quantity:
          description: Current stock quantity.
          $ref: "#/components/schemas/Decimal"
        product:
          type: [object, "null"]
          properties:
            id:
              type: integer
              example: 79
            name:
              type: string
              example: Detergent SINOJAN-7L
            low_stock:
              description: Low-stock threshold set on the product.
              $ref: "#/components/schemas/Decimal"
      example:
        quantity: "0.000000"
        product_id: 79
        product:
          id: 79
          name: Detergent SINOJAN-7L
          low_stock: "100.000000"

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The email field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.

    PermissionTree:
      type: object
      description: |
        Permission names `module:<module>.menu:<menu>.permission:<action>` grouped by module and
        menu. `module` is an empty object `{}` when there are no permissions.
      properties:
        module:
          type: object
          additionalProperties:
            type: object
            properties:
              menu:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    permission:
                      type: array
                      items:
                        type: string
      example:
        module:
          customer-manage:
            menu:
              customer:
                permission: [view, create, edit, delete, change-status]
          sales-transaction:
            menu:
              sales:
                permission: [view]

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: admin
        status:
          type: string
          enum: [Active, Inactive]
          example: Active
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2026-11-05T03:39:15.000000Z"
        permissions:
          $ref: "#/components/schemas/PermissionTree"

    RoleRequest:
      type: object
      description: |
        Body for create and update. `permissions` takes full permission names, not the tree.
        Build each name as `module:<module>.menu:<menu>.permission:<action>`.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 55
          description: Must be unique among `web` roles and cannot be `superadmin`.
          example: Accountant
        status:
          type: string
          enum: [Active, Inactive]
          description: "Create: defaults to `Active`. Update: keeps the current status when missing."
          example: Active
        permissions:
          type: array
          description: Existing permission names (guard `web`), no duplicates.
          items:
            type: string
          example:
            - module:customer-manage.menu:customer.permission:view
            - module:customer-manage.menu:customer.permission:create

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1

  responses:
    SessionUnavailable:
      description: No session for this origin. The origin is missing from `SANCTUM_STATEFUL_DOMAINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Session is not available for this origin. Check SANCTUM_STATEFUL_DOMAINS.

    Unauthorized:
      description: Not logged in or the session has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Unauthenticated.

    CsrfMismatch:
      description: CSRF token is missing, invalid or expired. Call `GET /csrf-token` again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: CSRF token mismatch.

    Forbidden:
      description: The user does not have the Spatie permission this endpoint needs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: User does not have the right permissions.

    RoleNotFound:
      description: No role with this ID, a non-numeric ID, or the `superadmin` role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Role not found.

    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    TooManyRequests:
      description: Too many login attempts. Limit is 5 requests per minute.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Too Many Attempts.
