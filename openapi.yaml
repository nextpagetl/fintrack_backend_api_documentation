        `admin/manufacturing-setup-noninventory-edit/{id}`). This is a **partial update**: every
        field is optional, and a field that is not sent keeps its current value. If validation
        fails, nothing is saved.

        - `name`, `price` and `description` use the same rules as create; the item's own name may
          be kept. Send `null` to clear `price` or `description`.
