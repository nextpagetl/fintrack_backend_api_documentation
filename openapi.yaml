      summary: Delete non-inventory
      description: |
        Soft-deletes a non-inventory item (`deleted_at` is set; the row stays in the database). A
        deleted item is no longer listed (also not in the BOM / WIP form dropdowns), returns `404`
        on every other endpoint, and its name can be used again.

        The item cannot be deleted (`409`) when any BOM or WIP non-inventory line uses it
        (`bom_non_inventories.non_inventory_account_id`, `wip_non_inventories.non_inventory_account_id`;
        soft-deleted lines are not counted). `errors.used_in` lists which. The web list's usage
        check is commented out, so it never shows a delete button; the API allows deleting unused
        items.

        Required permission: `module:manufacturing-setup.menu:non-inventory.permission:delete`
      operationId: deleteNonInventory

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/NonInventoryId"

      responses:
        "200":
          description: Non-inventory deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 3
              example:
                code: 200
                success: true
                message: Non-inventory deleted successfully.
                data:
                  id: 3

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NonInventoryNotFound"

        "409":
          description: The item is still used by BOM or WIP lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 409
                success: false
                message: Non-inventory is in use and cannot be deleted.
