          example: 1
        company_id:
          type: integer
          example: 1
        division_id:
          type: integer
          example: 1
        division:
          type: [object, "null"]
          description: The district's division (`null` if the division was deleted).
          properties:
            id:
              type: integer
              example: 1
            name:
              type: [string, "null"]
              example: Chattagram
        name:
          type: [string, "null"]
          example: Comilla
        bn_name:
          type: [string, "null"]
          description: Name in Bangla.
          example: কুমিল্লা
        lat:
          type: [string, "null"]
          description: Latitude (stored as text).
          example: "23.4682747"
        lon:
          type: [string, "null"]
          description: Longitude (stored as text).
          example: "91.1788135"
        url:
          type: [string, "null"]
          description: Website. Older rows may hold a URL without a scheme (`www.comilla.gov.bd`).
          example: www.comilla.gov.bd
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:02:08.000000Z"

    DistrictRequest:
      type: object
      description: |
        Body for create. Rules come from the district form settings (same as the web form), plus
        an existing division and a unique name. `status` is not taken from the body; the district
        is always saved as `Approved`.
      required:
        - division_id
        - name
      properties:
        division_id:
          type: integer
          description: Existing (not soft-deleted) division.
          example: 6
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Unique across all districts, whatever the division (not case-sensitive; soft-deleted ones not counted).
          example: Api District
        bn_name:
          type: [string, "null"]
          maxLength: 100
          example: এপিআই জেলা
        lat:
          type: [string, "null"]
          maxLength: 255
          example: "23.81"
        lon:
          type: [string, "null"]
          maxLength: 255
          example: "90.41"
        url:
          type: [string, "null"]
          format: uri
          maxLength: 255
          description: Full URL with a scheme (`https://…`).
          example: https://api.gov.bd

    Upazila:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company_id:
          type: integer
          example: 1
        district_id:
          type: integer
          example: 1
        district:
          type: [object, "null"]
          description: The upazila's district (`null` if the district was deleted).
          properties:
            id:
              type: integer
              example: 1
            name:
              type: [string, "null"]
              example: Test District
        name:
          type: [string, "null"]
          example: Test Upazila
        bn_name:
          type: [string, "null"]
          description: Name in Bangla.
          example: টেস্ট উপজেলা
        url:
          type: [string, "null"]
          description: Website. Older rows may hold a URL without a scheme (`test-upazila.example.com`).
          example: test-upazila.example.com
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          example: Approved
        created_at:
          type: [string, "null"]
          format: date-time
          example: "2025-01-18T10:02:08.000000Z"

    UpazilaRequest:
      type: object
      description: |
        Upazila fields. Rules come from the upazila form settings (same as the web form), plus an
        existing district and a name unique within the district. `district_id` and `name` are
        required on create; on update every field is optional (see the endpoint).
      properties:
        district_id:
          type: integer
          description: Existing (not soft-deleted) district.
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: |
            Unique within the district (not case-sensitive; soft-deleted upazilas not counted).
            Other districts may use the same name.
          example: Sample Upazila
        bn_name:
          type: [string, "null"]
          maxLength: 100
          example: নমুনা উপজেলা
        url:
          type: [string, "null"]
          format: uri
          maxLength: 255
          description: Full URL with a scheme (`https://…`).
          example: https://sample-upazila.example.com
        status:
          type: string
          enum: [Approved, Inactive, Pending, Cancel]
          description: Optional; cannot be empty when sent. Create defaults to `Approved`.
