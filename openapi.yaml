                  name:
                    - The name field is required.
            duplicateName:
              summary: Name already used by another customer group of the company
              value:
                code: 422
                success: false
                message: "Validation Failed. The name has already been taken. "
                errors:
                  name:
                    - The name has already been taken.
            invalidStatus:
              summary: Update only — status missing or not Approved / Inactive / Pending / Cancel
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

    SupplierGroupNotFound:
      description: No supplier group with this ID in the logged-in user's company, or a non-numeric or soft-deleted ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    SupplierGroupValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingName:
              summary: Name missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. "
                errors:
                  name:
                    - The name field is required.
            duplicateName:
              summary: Name already used by another supplier group of the company
              value:
                code: 422
                success: false
                message: "Validation Failed. The name has already been taken. "
                errors:
                  name:
                    - The name has already been taken.
            invalidStatus:
              summary: Update only — status missing or not Approved / Inactive / Pending / Cancel
              value:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

    UnitNotFound:
      description: No unit with this ID in the logged-in user's company, or a non-numeric or soft-deleted ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 404
            success: false
            message: Not Found
            errors: Data Not Found

    UnitValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorEnvelope"
          examples:
            missingName:
              summary: Name missing
              value:
                code: 422
                success: false
                message: "Validation Failed. The name field is required. "
                errors:
                  name:
                    - The name field is required.
            duplicateName:
              summary: Name already used by another unit of the company
              value:
                code: 422
                success: false
                message: "Validation Failed. The name has already been taken. "
                errors:
                  name:
                    - The name has already been taken.
            invalidStatus:
              summary: Update only — status missing or not Approved / Inactive / Pending / Cancel
              value:
