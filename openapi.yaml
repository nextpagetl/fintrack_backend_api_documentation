            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Approved, Inactive]
                  example: Inactive

      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Product"
              example:
                code: 200
                success: true
                message: Status updated successfully.
                data:
                  id: 1
                  company_id: 1
                  code: null
                  name: Silicone Softener WM-80
                  category_id: 7
                  category_name: Silicone
                  brand_id: 1
                  brand_name: Brand1
                  unit_id: 1
                  unit_name: KG
                  product_type_id: 3
                  product_type_name: Raw Material & Finished Good
                  purchases_price: "1.810000"
                  sale_price: "2.300000"
                  sd_rate: null
                  vat_rate: null
                  low_stock: "100.000000"
                  description: null
                  image: null
                  image_url: null
                  images: []
                  status: Inactive
                  created_at: "2025-01-18T10:14:49.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          description: Status is missing or not `Approved` / `Inactive`; nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
              example:
                code: 422
                success: false
                message: "Validation Failed. The selected status is invalid. "
                errors:
                  status:
                    - The selected status is invalid.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel session cookie set by `GET /csrf-token` and authenticated by `POST /login`.
        The actual cookie name comes from `SESSION_COOKIE` (default: the app name + `_session`).

  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token from `GET /csrf-token` or from the last login/logout response.
      schema:
        type: string

    RoleId:
      name: id
      in: path
      required: true
      description: Role ID. The `superadmin` role, an unknown ID or a non-numeric ID returns `404`.
      schema:
        type: integer
      example: 3

    BranchId:
      name: id
      in: path
      required: true
      description: |
        Branch ID. An unknown, soft-deleted or non-numeric ID, or a branch of another company
        (for users other than the super admin), returns `404`.
      schema:
        type: integer
      example: 2

    StoreId:
      name: id
      in: path
      required: true
      description: |
        Store ID. An unknown, soft-deleted or non-numeric ID returns `404`. Stores of other
        companies are not blocked.
      schema:
        type: integer
      example: 6

    DivisionId:
      name: id
