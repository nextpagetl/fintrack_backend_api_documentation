  /product-categories/{id}:
    put:
      tags:
        - Product Categories
      summary: Update product category
      description: |
        Updates a product category (API version of the web edit form
        `admin/inventory-setup-category-edit/{id}`). This is a **partial update**: every field is
        optional, and a field that is not sent keeps its current value.

        - `status` is changed only when sent (`Approved`, `Inactive`, `Pending` or `Cancel`);
          otherwise the category keeps its current status. (The web form always saves
          `Approved`.)
        - `name` must be unique among categories that are not soft-deleted (not
          case-sensitive); the category's own name may be kept.
        - `parent_id` cannot be the category itself or any of its child categories (at any
          depth). Send `null` to make it a top-level category.
        - `company_id` is set to the logged-in user's company.

        Required permission: `module:product-manage.menu:product-category.permission:edit`
      operationId: updateProductCategory

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ProductCategoryId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: All fields are optional; send only what should change.
              properties:
                name:
                  $ref: "#/components/schemas/ProductCategoryName"
                parent_id:
                  $ref: "#/components/schemas/ProductCategoryParentId"
                priority:
                  $ref: "#/components/schemas/ProductCategoryPriority"
                status:
                  type: string
                  enum: [Approved, Inactive, Pending, Cancel]
                  example: Inactive
            examples:
              nameOnly:
                summary: Rename only
                value:
                  name: Api Category 2
              moveToTopLevel:
                summary: Remove the parent
                value:
                  parent_id: null
              priorityAndStatus:
                summary: Change priority and status
                value:
                  priority: 9
                  status: Inactive

      responses:
        "200":
          description: Product category updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProductCategory"
              example:
                code: 200
                success: true
                message: Product category updated successfully.
                data:
                  id: 11
                  company_id: 1
                  name: Api Category
                  parent_id: null
                  parent_name: null
                  priority: 9
                  status: Inactive
                  created_at: "2026-11-10T07:02:27.000000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ProductCategoryNotFound"

        "419":
          $ref: "#/components/responses/CsrfMismatch"

        "422":
          $ref: "#/components/responses/ProductCategoryValidationError"

    delete:
      tags:
        - Product Categories
      summary: Delete product category
      description: |
        Soft-deletes a product category (`deleted_at` is set; the row stays in the database). A
        deleted category is no longer listed, returns `404` on every other endpoint, and its
        name can be used again through the API.

        The category cannot be deleted (`409`) when it is still used (`errors.used_in` lists
        where):

        - `products` — a product has this category (soft-deleted products are not counted)
        - `stock_summaries` — a stock summary row has this category
        - `booking_details` — a booking detail has this category (soft-deleted rows are not counted)
        - `child_categories` — another category has this one as its parent

        The web list only hides the delete button for categories used by products; the API
        blocks the delete on the server.

        Required permission: `module:product-manage.menu:product-category.permission:delete`
      operationId: deleteProductCategory

      security:
        - sessionCookie: []

      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ProductCategoryId"

      responses:
        "200":
          description: Product category deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
